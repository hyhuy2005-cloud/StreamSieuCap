<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Ultimate Version</title>
    <style>
        /* ==========================================
           BẢNG MÀU LUXURY & CSS CƠ BẢN
           ========================================== */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111; /* Thay bằng hình nền vân đá marble sẽ rất đẹp */
            color: var(--luxury-grey-light);
            margin: 0;
            padding: 15px;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            letter-spacing: 2px;
        }

        /* ==========================================
           MODAL CHÀO MỪNG (NHẬP TÊN)
           ========================================== */
        #welcomeModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--luxury-gold);
            box-shadow: 0 0 30px rgba(198, 156, 109, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            color: var(--luxury-gold);
            margin-top: 0;
            font-size: 2em;
        }

        .modal-content input {
            padding: 15px;
            font-size: 16px;
            text-align: center;
            margin: 20px 0;
            border: 1px solid var(--luxury-gold);
            background: #000;
            color: var(--luxury-gold);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .modal-content button {
            padding: 15px;
            font-size: 16px;
            width: 100%;
        }

        /* ==========================================
           BỐ CỤC CHÍNH (Được ẩn lúc đầu)
           ========================================== */
        .main-layout {
            display: none; /* Ẩn cho đến khi nhập tên */
            grid-template-columns: 360px 1fr 320px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            height: 85vh;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* PANEL CÔNG CỤ */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(198, 156, 109, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 5px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3em;
            border-bottom: 1px solid var(--luxury-maroon);
            padding-bottom: 8px;
            text-align: center;
        }

        /* KHU VỰC ĐIỀU KHIỂN & INPUT */
        .control-group { margin-bottom: 5px; }
        .control-group label { font-size: 13px; color: var(--luxury-gold); margin-bottom: 5px; display: block;}
        
        select, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--luxury-grey-medium);
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            background: #0a0a0a;
            color: var(--luxury-gold);
        }
        
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }

        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        /* KHU VỰC CHỜ (Làm mờ khi chưa vào phòng) */
        .disabled-area {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* BUTTONS */
        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(198, 156, 109, 0.5); transform: translateY(-2px); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }

        /* KHU VỰC VIDEO GRID (MÀN HÌNH CHÍNH) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            align-content: start;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(198, 156, 109, 0.3);
            overflow-y: auto;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            border: 2px solid var(--luxury-gold);
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
        }
        
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: var(--luxury-gold);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(198, 156, 109, 0.5);
        }

        /* KHU VỰC CHAT */
        .chat-box { flex: 1; display: flex; flex-direction: column; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid rgba(198, 156, 109, 0.2);
            min-height: 200px;
        }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }
        .sys-warn { color: #ff9f43; font-style: italic; font-weight: bold; }

        .user-badge {
            text-align: center;
            color: var(--luxury-gold);
            padding: 10px;
            background: #000;
            border-radius: 6px;
            border: 1px dashed rgba(198, 156, 109, 0.5);
            margin-bottom: 10px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- MODAL NHẬP TÊN ĐẦU TIÊN -->
    <div id="welcomeModal">
        <div class="modal-content">
            <h2>♛ Kính Chào ♛</h2>
            <p style="color: var(--luxury-grey-light);">Vui lòng nhập biệt danh trước khi vào phòng</p>
            <input type="text" id="welcomeNameInput" placeholder="VD: GamerPro99" onkeypress="if(event.key === 'Enter') confirmName()">
            <button class="btn-gold" onclick="confirmName()">Tiến Vào Phòng</button>
        </div>
    </div>

    <h1>♛ Phòng Live Đa Kết Nối ♛</h1>
    
    <div class="main-layout" id="mainLayout">
        
        <!-- CỘT TRÁI: QUẢN LÝ PHÒNG & STREAM -->
        <div class="panel">
            <h3>THÔNG TIN CỦA BẠN</h3>
            <div class="user-badge">
                Tên hiển thị: <strong id="displayUsername" style="font-size: 16px;">Đang tải...</strong>
            </div>

            <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 5px 0;">

            <h3>KẾT NỐI PHÒNG</h3>
            <div class="control-group">
                <label>Mã / Tên Phòng:</label>
                <input type="text" id="roomInput" placeholder="VD: phong-cua-boss">
            </div>
            
            <div class="flex-row">
                <button class="btn-gold" id="btnCreateRoom">Tạo Phòng (Host)</button>
                <button class="btn-dark" id="btnJoinRoom">Vào Phòng</button>
            </div>
            
            <p id="roomStatus" style="font-size: 12px; color: var(--luxury-maroon); text-align: center; margin: 10px 0 0 0;"></p>

            <!-- CẤU HÌNH LIVE BỊ KHÓA CHO ĐẾN KHI VÀO PHÒNG -->
            <div id="liveConfigArea" class="disabled-area">
                <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 15px 0;">
                
                <h3>CẤU HÌNH LIVE PRO</h3>
                <div class="flex-row control-group">
                    <div>
                        <label>Độ Nét:</label>
                        <select id="resSelect">
                            <option value="480">480p</option>
                            <option value="720">720p</option>
                            <option value="1080" selected>1080p</option>
                        </select>
                    </div>
                    <div>
                        <label>FPS:</label>
                        <select id="fpsSelect">
                            <option value="30">30</option>
                            <option value="60" selected>60</option>
                        </select>
                    </div>
                    <div>
                        <label>Bitrate:</label>
                        <select id="bitrateSelect">
                            <option value="5000000">5 Mbps</option>
                            <option value="8000000">8 Mbps</option>
                            <option value="15000000" selected>15 Mbps</option>
                        </select>
                    </div>
                </div>

                <button class="btn-gold" id="btnStartStream" style="margin-top: 10px;">🔴 Bắt Đầu Phát Live</button>
                <button class="btn-maroon" id="btnStopStream" style="display:none; margin-top: 10px;">⬛ Dừng Phát Live</button>
            </div>
        </div>

        <!-- CỘT GIỮA: MÀN HÌNH VIDEO GRID -->
        <div class="video-grid" id="videoGrid"></div>

        <!-- CỘT PHẢI: CHAT VÀ THÔNG TIN -->
        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Chào mừng! Hãy tạo hoặc vào phòng.</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." disabled>
                    <button class="btn-gold" id="btnSendChat" style="width: 80px;" disabled>Gửi</button>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--luxury-grey-medium);">
                <p>Thành viên trong phòng: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong></p>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let myUsername = "";
        let isHost = false;
        let myStream = null;
        
        let connectedPeers = new Set();  
        let peerUsernames = {};          
        let dataConnections = {};        
        let mediaCalls = {};             

        const peerConfig = {
            config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] }
        };

        // UI Elements
        const roomStatus = document.getElementById('roomStatus');
        const videoGrid = document.getElementById('videoGrid');
        const memberCount = document.getElementById('memberCount');
        const liveConfigArea = document.getElementById('liveConfigArea');

        // --- 0. BƯỚC NHẬP TÊN ĐẦU TIÊN ---
        function confirmName() {
            const input = document.getElementById('welcomeNameInput').value.trim();
            if (!input) {
                alert("Bạn phải nhập tên để mọi người biết bạn là ai chứ!");
                return;
            }
            myUsername = input;
            
            // Ẩn modal và hiện Layout chính
            document.getElementById('welcomeModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeModal').style.display = 'none';
                document.getElementById('mainLayout').style.display = 'grid';
                document.getElementById('displayUsername').innerText = myUsername;
            }, 500);
        }

        // --- HÀM ÉP XUNG MẠNG (GIỮ ĐỘ NÉT) ---
        async function forceHighBitrate(call) {
            try {
                if (!call.peerConnection) return;
                const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    const params = sender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    
                    const selectedBitrate = parseInt(document.getElementById('bitrateSelect').value);
                    params.encodings[0].maxBitrate = selectedBitrate; 
                    
                    // Ép giữ nguyên độ phân giải, chống mờ
                    params.degradationPreference = 'maintain-resolution';
                    
                    await sender.setParameters(params);
                }
            } catch (e) {
                console.error("Lỗi ép thông số:", e);
            }
        }

        // --- 1. XỬ LÝ VÀO / TẠO PHÒNG ---
        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập mã/tên phòng!");
            initPeer('room-' + rName, true);
        });

        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập mã/tên phòng muốn vào!");
            initPeer(null, false, rName);
        });

        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy();
            
            roomStatus.innerText = "Đang kết nối server...";
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id;
                isHost = hostMode;
                
                // Gắn mác Host vào tên nếu là chủ phòng
                if(isHost && !myUsername.includes("Host")) {
                    myUsername += " ♛";
                    document.getElementById('displayUsername').innerText = myUsername;
                }
                
                peerUsernames[myId] = myUsername; 
                
                roomStatus.innerText = isHost ? "✅ Đã tạo phòng thành công!" : "✅ Đã tham gia phòng!";
                roomStatus.style.color = "var(--luxury-gold)";
                
                // KHÓA INPUT PHÒNG, MỞ KHÓA CONFIG LIVE VÀ CHAT
                document.getElementById('roomInput').disabled = true;
                document.getElementById('btnCreateRoom').disabled = true;
                document.getElementById('btnJoinRoom').disabled = true;
                
                liveConfigArea.classList.remove('disabled-area');
                document.getElementById('chatInput').disabled = false;
                document.getElementById('btnSendChat').disabled = false;

                if (!isHost) {
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
                
                updateMemberCount();
            });

            peer.on('connection', (conn) => { setupDataConnection(conn); });

            // Nhận cuộc gọi (người khác stream cho mình xem)
            peer.on('call', (call) => {
                call.answer(myStream); // Bắt máy, nếu mình có stream thì gửi ngược lại luôn
                forceHighBitrate(call); 
                
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream);
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("Tên phòng này đã có người tạo. Vui lòng bấm 'Vào Phòng' thay vì Tạo mới.");
                    roomStatus.innerText = "❌ Lỗi trùng tên phòng.";
                } else if (err.type === 'peer-unavailable') {
                    alert("Không tìm thấy phòng này! Có thể Host chưa tạo phòng.");
                    roomStatus.innerText = "❌ Không tìm thấy phòng.";
                } else {
                    console.error(err);
                }
                
                // Mở khóa lại nút nếu lỗi
                document.getElementById('roomInput').disabled = false;
                document.getElementById('btnCreateRoom').disabled = false;
                document.getElementById('btnJoinRoom').disabled = false;
            });
        }

        // --- 2. XỬ LÝ ĐỒNG BỘ P2P VÀ YÊU CẦU STREAM ---
        function setupDataConnection(conn) {
            conn.on('open', () => {
                connectedPeers.add(conn.peer);
                dataConnections[conn.peer] = conn;

                // 1. Gửi Tên cho đối phương
                conn.send({ type: 'HANDSHAKE', username: myUsername });
                
                // 2. YÊU CẦU STREAM (GIẢI QUYẾT LỖI VÀO SAU KHÔNG THẤY HÌNH)
                // Chờ 1 giây để handshake hoàn tất rồi xin luồng hình ảnh
                setTimeout(() => {
                    if(conn.open) conn.send({ type: 'REQUEST_STREAM' });
                }, 1000);

                if (isHost) {
                    const peersData = Array.from(connectedPeers)
                        .filter(id => id !== conn.peer)
                        .map(id => ({ id: id, username: peerUsernames[id] || "Khách" }));

                    conn.send({ type: 'PEER_LIST', peers: peersData });

                    peersData.forEach(p => {
                        if(dataConnections[p.id]) {
                            dataConnections[p.id].send({ 
                                type: 'NEW_PEER', 
                                peer: conn.peer, 
                                username: peerUsernames[conn.peer] || "Khách" 
                            });
                        }
                    });
                }
                updateMemberCount();
            });

            conn.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    peerUsernames[conn.peer] = data.username;
                    sysLog(`<strong>${data.username}</strong> đã tham gia phòng.`);
                    updateVideoLabel(conn.peer);
                }
                else if (data.type === 'REQUEST_STREAM') {
                    // Đối phương (người mới vào) yêu cầu gửi hình. Nếu mình đang live thì call nó ngay!
                    if (myStream) {
                        const call = peer.call(conn.peer, myStream);
                        forceHighBitrate(call);
                        mediaCalls[conn.peer] = call;
                    }
                }
                else if (data.type === 'PEER_LIST') {
                    data.peers.forEach(p => {
                        peerUsernames[p.id] = p.username;
                        if (p.id !== myId && !dataConnections[p.id]) {
                            const newConn = peer.connect(p.id);
                            setupDataConnection(newConn);
                        }
                    });
                } 
                else if (data.type === 'NEW_PEER') {
                    peerUsernames[data.peer] = data.username;
                    if (data.peer !== myId && !dataConnections[data.peer]) {
                        const newConn = peer.connect(data.peer);
                        setupDataConnection(newConn);
                    }
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
            });

            // XỬ LÝ KHÉO LÉO KHI CÓ NGƯỜI THOÁT RA
            conn.on('close', () => {
                const isDisconnectedHost = conn.peer.startsWith('room-');
                const name = peerUsernames[conn.peer] || "Một người";
                
                if (isDisconnectedHost) {
                    sysWarn(`⚠️ CẢNH BÁO: Chủ phòng (${name}) đã thoát! Người mới sẽ không thể vào phòng nữa.`);
                } else {
                    sysLog(`<strong>${name}</strong> đã rời khỏi phòng.`);
                }
                
                // Dọn dẹp dữ liệu và XÓA VIDEO NGAY LẬP TỨC
                connectedPeers.delete(conn.peer);
                delete dataConnections[conn.peer];
                delete peerUsernames[conn.peer];
                
                removeVideoStream(conn.peer);
                updateMemberCount();
            });
        }

        // --- 3. PHÁT LIVE MÀN HÌNH CHẤT LƯỢNG CAO ---
        document.getElementById('btnStartStream').addEventListener('click', async () => {
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }
            if(resVal === 480) { w = 854; h = 480; }

            try {
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        width: { ideal: w, max: w }, 
                        height: { ideal: h, max: h }, 
                        frameRate: { ideal: fpsVal, max: fpsVal } 
                    },
                    audio: true
                });

                const videoTrack = myStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.contentHint = 'detail';
                }

                addVideoStream('me', myStream, true);

                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';
                
                document.getElementById('resSelect').disabled = true;
                document.getElementById('fpsSelect').disabled = true;
                document.getElementById('bitrateSelect').disabled = true;

                // Nếu ấn nút "Stop Sharing" của trình duyệt
                myStream.getVideoTracks()[0].onended = stopStream;

                // Chủ động gửi Stream cho những người đang có trong phòng
                connectedPeers.forEach(id => {
                    const call = peer.call(id, myStream);
                    mediaCalls[id] = call;
                    forceHighBitrate(call); 
                });

            } catch (err) {
                console.error("Lỗi chia sẻ màn hình:", err);
            }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            removeVideoStream('me');
            
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            
            document.getElementById('resSelect').disabled = false;
            document.getElementById('fpsSelect').disabled = false;
            document.getElementById('bitrateSelect').disabled = false;

            mediaCalls = {};
        }

        // --- 4. HÀM XỬ LÝ HIỂN THỊ VIDEO TRÊN MÀN HÌNH ---
        function addVideoStream(id, stream, isMe = false) {
            // Tránh tạo 2 video của cùng 1 người
            if (document.getElementById('video-wrap-' + id)) {
                document.getElementById('video-' + id).srcObject = stream;
                return;
            }

            const wrap = document.createElement('div');
            wrap.className = 'video-wrapper';
            wrap.id = 'video-wrap-' + id;

            const vid = document.createElement('video');
            vid.id = 'video-' + id;
            vid.srcObject = stream;
            vid.autoplay = true;
            vid.playsInline = true;
            vid.controls = !isMe;
            if (isMe) vid.muted = true; // Chống dội âm mình

            const label = document.createElement('div');
            label.className = 'video-label';
            label.id = 'video-label-' + id;
            
            const displayName = isMe ? `${myUsername} (Bạn)` : (peerUsernames[id] || `Thành viên`);
            label.innerText = `🔴 ${displayName}`;

            wrap.appendChild(vid);
            wrap.appendChild(label);
            videoGrid.appendChild(wrap);
        }

        function updateVideoLabel(id) {
            const label = document.getElementById('video-label-' + id);
            if (label && peerUsernames[id]) {
                label.innerText = `🔴 ${peerUsernames[id]}`;
            }
        }

        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) el.remove();
        }

        function updateMemberCount() {
            memberCount.innerText = connectedPeers.size + 1;
        }

        // --- 5. HỆ THỐNG CHAT ---
        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const dataPacket = { type: 'CHAT', sender: myUsername, msg: msg };
            
            appendChat("Bạn", msg);
            input.value = '';

            connectedPeers.forEach(id => {
                if (dataConnections[id] && dataConnections[id].open) {
                    dataConnections[id].send(dataPacket);
                }
            });
        }

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            p.innerHTML = `<span class="sender" style="color:${color}">${sender}:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }

        function sysLog(msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            p.innerHTML = `<span class="sys-msg">Hệ Thống:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }
        
        function sysWarn(msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            p.innerHTML = `<span class="sys-warn">${msg}</span>`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
