<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Multi Stream</title>
    <style>
        /* BẢNG MÀU LUXURY & CSS CƠ BẢN */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111; /* Thay bằng hình nền Marble nếu muốn */
            color: var(--luxury-grey-light);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            letter-spacing: 2px;
        }

        /* BỐ CỤC CHÍNH */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            height: 85vh; /* Chiều cao tổng thể */
        }

        /* PANEL CÔNG CỤ */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(198, 156, 109, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 5px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3em;
            border-bottom: 1px solid var(--luxury-maroon);
            padding-bottom: 8px;
            text-align: center;
        }

        /* KHU VỰC ĐIỀU KHIỂN & INPUT */
        .control-group { margin-bottom: 10px; }
        .control-group label { font-size: 13px; color: var(--luxury-gold); margin-bottom: 5px; display: block;}
        
        select, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--luxury-grey-medium);
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: #0a0a0a;
            color: var(--luxury-gold);
        }
        
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }

        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }

        /* BUTTONS */
        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(198, 156, 109, 0.5); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }

        /* KHU VỰC VIDEO GRID (MÀN HÌNH CHÍNH) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            align-content: start;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(198, 156, 109, 0.3);
            overflow-y: auto;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            border: 2px solid var(--luxury-gold);
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--luxury-gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(198, 156, 109, 0.5);
        }

        /* KHU VỰC CHAT */
        .chat-box { flex: 1; display: flex; flex-direction: column; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid rgba(198, 156, 109, 0.2);
            min-height: 200px;
        }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>♛ Phòng Live Đa Kết Nối ♛</h1>
    
    <div class="main-layout">
        
        <!-- CỘT TRÁI: QUẢN LÝ PHÒNG & STREAM -->
        <div class="panel">
            <h3>QUẢN LÝ PHÒNG</h3>
            
            <div class="control-group">
                <label>Tên Phòng (Viết liền, không dấu):</label>
                <input type="text" id="roomInput" placeholder="VD: phong-cua-boss">
            </div>
            
            <div class="flex-row">
                <button class="btn-gold" id="btnCreateRoom">Tạo Phòng (Host)</button>
                <button class="btn-dark" id="btnJoinRoom">Vào Phòng</button>
            </div>
            
            <p id="roomStatus" style="font-size: 12px; color: var(--luxury-maroon); text-align: center; margin: 0;"></p>

            <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 10px 0;">

            <h3>CẤU HÌNH LIVE</h3>
            <div class="flex-row control-group">
                <div>
                    <label>Độ Phân Giải:</label>
                    <select id="resSelect">
                        <option value="480">480p (Thấp)</option>
                        <option value="720" selected>720p (HD)</option>
                        <option value="1080">1080p (FHD)</option>
                    </select>
                </div>
                <div>
                    <label>Tốc độ khung hình (FPS):</label>
                    <select id="fpsSelect">
                        <option value="30" selected>30 FPS</option>
                        <option value="60">60 FPS</option>
                    </select>
                </div>
            </div>

            <button class="btn-gold" id="btnStartStream" disabled>Bắt Đầu Phát Live</button>
            <button class="btn-maroon" id="btnStopStream" style="display:none;">Dừng Phát Live</button>
        </div>

        <!-- CỘT GIỮA: MÀN HÌNH VIDEO GRID -->
        <div class="video-grid" id="videoGrid">
            <!-- Video sẽ được thêm tự động bằng JS -->
        </div>

        <!-- CỘT PHẢI: CHAT VÀ THÔNG TIN -->
        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Hãy tạo hoặc vào phòng để bắt đầu.</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." disabled>
                    <button class="btn-gold" id="btnSendChat" style="width: 80px;" disabled>Gửi</button>
                </div>
            </div>
            <div style="margin-top: 15px; font-size: 12px; color: var(--luxury-grey-medium);">
                <p>Số người trong phòng: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong></p>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let isHost = false;
        let myStream = null;
        
        let connectedPeers = new Set(); // Chứa ID của mọi người trong phòng
        let dataConnections = {}; // Lưu kết nối Chat (Data)
        let mediaCalls = {};      // Lưu kết nối Video (Media)

        // STUN Server vượt tường lửa
        const peerConfig = {
            config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] }
        };

        const roomStatus = document.getElementById('roomStatus');
        const videoGrid = document.getElementById('videoGrid');
        const memberCount = document.getElementById('memberCount');

        // --- 1. XỬ LÝ VÀO / TẠO PHÒNG ---
        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng!");
            
            initPeer('room-' + rName, true); // Đặt ID cố định cho Host
        });

        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng muốn vào!");
            
            initPeer(null, false, rName); // Lấy ID ngẫu nhiên, sau đó kết nối Host
        });

        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy(); // Hủy kết nối cũ nếu có
            
            roomStatus.innerText = "Đang khởi tạo...";
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id;
                isHost = hostMode;
                roomStatus.innerText = isHost ? "Đã tạo phòng thành công!" : "Đã lấy ID, đang vào phòng...";
                roomStatus.style.color = "var(--luxury-gold)";
                
                document.getElementById('btnStartStream').disabled = false;
                document.getElementById('chatInput').disabled = false;
                document.getElementById('btnSendChat').disabled = false;

                if (!isHost) {
                    // Nếu là khách, kết nối tới Host để xin danh sách phòng
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
                
                updateMemberCount();
            });

            // Lắng nghe người khác kết nối Data (Chat/Signaling) tới mình
            peer.on('connection', (conn) => { setupDataConnection(conn); });

            // Lắng nghe người khác gọi Video tới mình
            peer.on('call', (call) => {
                // Trả lời cuộc gọi (nếu mình đang stream thì gửi stream của mình lại cho họ)
                call.answer(myStream);
                
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream);
                });
                
                call.on('close', () => {
                    removeVideoStream(call.peer);
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("Tên phòng đã có người tạo (Host). Vui lòng chọn 'Vào Phòng' hoặc đổi tên khác.");
                    roomStatus.innerText = "Lỗi tạo phòng.";
                } else {
                    console.error(err);
                }
            });
        }

        // --- 2. XỬ LÝ MẠNG LƯỚI (MESH SIGNALING) ---
        function setupDataConnection(conn) {
            conn.on('open', () => {
                connectedPeers.add(conn.peer);
                dataConnections[conn.peer] = conn;
                updateMemberCount();

                // LƯỚI KẾT NỐI: Nếu mình là Host, mình giới thiệu người mới cho cả phòng
                if (isHost) {
                    // 1. Gửi toàn bộ danh sách phòng cho người mới
                    const peersArray = Array.from(connectedPeers).filter(id => id !== conn.peer);
                    conn.send({ type: 'PEER_LIST', peers: peersArray });
                    
                    // 2. Báo cho những người cũ biết có người mới vào
                    peersArray.forEach(id => {
                        dataConnections[id].send({ type: 'NEW_PEER', peer: conn.peer });
                    });
                }
                
                sysLog(`[${conn.peer.substring(0,6)}...] đã tham gia.`);
                
                // Nếu mình ĐANG phát live, tự động gọi video tới người mới vào
                if (myStream) {
                    const call = peer.call(conn.peer, myStream);
                    call.on('stream', (remoteStream) => addVideoStream(conn.peer, remoteStream));
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'PEER_LIST') {
                    // Mình mới vào, Host gửi danh sách -> kết nối với tất cả
                    data.peers.forEach(id => {
                        if (id !== myId && !dataConnections[id]) {
                            const newConn = peer.connect(id);
                            setupDataConnection(newConn);
                        }
                    });
                } 
                else if (data.type === 'NEW_PEER') {
                    // Host báo có người mới -> kết nối với người mới
                    if (data.peer !== myId && !dataConnections[data.peer]) {
                        const newConn = peer.connect(data.peer);
                        setupDataConnection(newConn);
                    }
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
            });

            conn.on('close', () => {
                connectedPeers.delete(conn.peer);
                delete dataConnections[conn.peer];
                removeVideoStream(conn.peer);
                updateMemberCount();
                sysLog(`[${conn.peer.substring(0,6)}...] đã rời đi.`);
            });
        }

        // --- 3. XỬ LÝ CHIA SẺ MÀN HÌNH (LIVE) TÁCH RIÊNG ĐỘ PHÂN GIẢI & FPS ---
        document.getElementById('btnStartStream').addEventListener('click', async () => {
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            
            // Tính toán Width x Height dựa trên độ phân giải chọn
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }
            if(resVal === 480) { w = 854; h = 480; }

            const videoConstraints = { width: w, height: h, frameRate: fpsVal };

            try {
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: videoConstraints,
                    audio: true // Vẫn nhớ nhắc người dùng chọn chia sẻ âm thanh hệ thống
                });

                // Hiển thị luồng của chính mình lên UI
                addVideoStream('me', myStream, true);

                // NÚT BẤM UI
                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';

                // Lắng nghe sự kiện tắt share màn hình mặc định của trình duyệt
                myStream.getVideoTracks()[0].onended = stopStream;

                // GỌI VIDEO TỚI TẤT CẢ MỌI NGƯỜI TRONG PHÒNG
                connectedPeers.forEach(id => {
                    const call = peer.call(id, myStream);
                    mediaCalls[id] = call;
                    call.on('stream', (remoteStream) => addVideoStream(id, remoteStream));
                });

            } catch (err) {
                console.error("Lỗi chia sẻ màn hình:", err);
            }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            removeVideoStream('me');
            
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            
            // Xóa các cuộc gọi cũ để tránh lỗi (PeerJS sẽ tự ngắt khi stream track bị stop)
            mediaCalls = {};
        }

        // --- 4. XỬ LÝ UI VIDEO & CHAT ---
        function addVideoStream(id, stream, isMe = false) {
            // Tránh duplicate video
            if (document.getElementById('video-wrap-' + id)) return;

            const wrap = document.createElement('div');
            wrap.className = 'video-wrapper';
            wrap.id = 'video-wrap-' + id;

            const vid = document.createElement('video');
            vid.srcObject = stream;
            vid.autoplay = true;
            vid.playsInline = true;
            vid.controls = !isMe;
            if (isMe) vid.muted = true; // Chống dội âm của chính mình

            const label = document.createElement('div');
            label.className = 'video-label';
            label.innerText = isMe ? "Bạn đang live" : "Khách: " + id.substring(0,5);

            wrap.appendChild(vid);
            wrap.appendChild(label);
            videoGrid.appendChild(wrap);
        }

        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) el.remove();
        }

        function updateMemberCount() {
            // Số lượng người trong phòng = những người kết nối + chính mình
            memberCount.innerText = connectedPeers.size + 1;
        }

        // --- CHAT SYSTEM ---
        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const senderName = isHost ? "Host♛" : myId.substring(0,4);
            const dataPacket = { type: 'CHAT', sender: senderName, msg: msg };
            
            appendChat("Bạn", msg);
            input.value = '';

            // Bắn tin nhắn cho tất cả những người đang kết nối với mình
            connectedPeers.forEach(id => {
                if (dataConnections[id] && dataConnections[id].open) {
                    dataConnections[id].send(dataPacket);
                }
            });
        }

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            p.innerHTML = `<span class="sender" style="color:${color}">${sender}:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }

        function sysLog(msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            p.innerHTML = `<span class="sys-msg">Hệ Thống:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
