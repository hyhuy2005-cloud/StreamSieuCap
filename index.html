<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Cross Platform</title>
    <style>
        /* ==========================================
           BẢNG MÀU LUXURY & CSS CƠ BẢN
           ========================================== */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: var(--luxury-grey-light);
            margin: 0; padding: 15px;
            text-align: center; overflow-x: hidden;
        }

        h1 {
            font-family: 'Playfair Display', serif; font-size: 2.2em;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0 20px 0; letter-spacing: 2px; text-transform: uppercase;
        }

        /* ==========================================
           HỆ THỐNG POPUP VÀO PHÒNG (2 BƯỚC)
           ========================================== */
        #overlayModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }

        .modal-box {
            background: var(--panel-bg); padding: 40px; border-radius: 15px;
            border: 2px solid var(--luxury-gold); box-shadow: 0 0 40px rgba(198, 156, 109, 0.2);
            width: 90%; max-width: 450px; text-align: center;
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-box h2 {
            font-family: 'Playfair Display', serif; color: var(--luxury-gold);
            margin-top: 0; font-size: 2em; border-bottom: 1px solid rgba(198, 156, 109, 0.3); padding-bottom: 15px;
        }

        .modal-box input {
            padding: 15px; font-size: 16px; text-align: center; margin: 15px 0;
            border: 1px solid var(--luxury-grey-medium); background: #000; color: var(--luxury-gold);
            border-radius: 8px; width: 100%; box-sizing: border-box;
        }
        .modal-box input:focus { border-color: var(--luxury-gold); outline: none; }
        .modal-box button { padding: 15px; font-size: 16px; width: 100%; margin-top: 10px; }

        .room-actions { display: flex; flex-direction: column; gap: 20px; text-align: left; }
        .action-card { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px dashed rgba(198, 156, 109, 0.4); }
        .action-card label { color: var(--luxury-gold); font-size: 13px; font-weight: bold; }

        #step2-Room { display: none; }

        /* ==========================================
           GIAO DIỆN CHÍNH (MAIN DASHBOARD)
           ========================================== */
        .main-layout {
            display: none; grid-template-columns: 330px 1fr 320px; gap: 20px;
            max-width: 1700px; margin: 0 auto; height: 85vh;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; height: auto; }
        }

        /* PANELS */
        .panel {
            background: var(--panel-bg); backdrop-filter: blur(10px); padding: 20px;
            border-radius: 12px; border: 1px solid rgba(198, 156, 109, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: left;
            display: flex; flex-direction: column; gap: 12px;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif; margin: 0 0 5px 0;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.3em; border-bottom: 1px solid var(--luxury-maroon); padding-bottom: 8px; text-align: center;
        }

        .control-group { margin-bottom: 5px; }
        .control-group label { font-size: 13px; color: var(--luxury-gold); margin-bottom: 5px; display: block;}
        
        select, input {
            padding: 10px; border-radius: 6px; border: 1px solid var(--luxury-grey-medium);
            font-size: 13px; width: 100%; box-sizing: border-box; background: #0a0a0a; color: var(--luxury-gold);
        }
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }
        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        /* BUTTONS */
        button {
            padding: 10px; font-size: 14px; font-weight: bold; border: none;
            border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase;
        }
        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(198, 156, 109, 0.5); transform: translateY(-2px); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }

        /* KHU VỰC VIDEO GRID & SELECTIVE RENDERING */
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px; align-content: start; padding: 10px; border-radius: 12px;
            background: rgba(0,0,0,0.4); border: 1px dashed rgba(198, 156, 109, 0.3); overflow-y: auto;
        }

        .video-wrapper {
            position: relative; background: #000; border-radius: 8px; border: 2px solid var(--luxury-gold);
            overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Overlay Chọn Để Xem */
        .stream-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 15;
            cursor: pointer; transition: 0.3s;
        }
        .stream-overlay:hover { background: rgba(0,0,0,0.7); }
        .stream-overlay .play-icon { font-size: 3em; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--luxury-gold)); }
        .stream-overlay span { color: var(--luxury-gold); font-weight: bold; font-size: 14px; text-align: center; padding: 0 10px;}
        
        /* Nút dừng xem ở góc */
        .btn-stop-viewing {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            background: rgba(141, 28, 28, 0.8); color: white; border: 1px solid var(--luxury-maroon);
            padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; text-transform: none; width: auto;
        }
        .btn-stop-viewing:hover { background: var(--luxury-maroon); }

        .video-label {
            position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.85);
            color: var(--luxury-gold); padding: 5px 10px; border-radius: 4px;
            font-size: 13px; font-weight: bold; border: 1px solid rgba(198, 156, 109, 0.5); z-index: 20;
        }

        /* KHU VỰC CHAT */
        .chat-box { flex: 1; display: flex; flex-direction: column; overflow:hidden;}
        .chat-messages {
            flex: 1; overflow-y: auto; background: #0a0a0a; padding: 10px;
            border-radius: 6px; margin-bottom: 10px; font-size: 13px; border: 1px solid rgba(198, 156, 109, 0.2);
            min-height: 180px;
        }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }
        .sys-warn { color: #ff9f43; font-style: italic; font-weight: bold; }
        
        .badge { background: #000; color: var(--luxury-gold); padding: 8px; text-align: center; border-radius: 6px; border: 1px dashed var(--luxury-gold); margin-bottom: 5px; font-size: 13px;}

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- OVERLAY POPUP 2 BƯỚC -->
    <div id="overlayModal">
        <div class="modal-box" id="step1-Name">
            <h2>♛ Kính Chào ♛</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 20px;">Vui lòng nhập biệt danh của bạn</p>
            <input type="text" id="welcomeNameInput" placeholder="VD: GamerPro99" onkeypress="if(event.key === 'Enter') goToStep2()">
            <button class="btn-gold" onclick="goToStep2()">Tiếp Tục</button>
        </div>

        <div class="modal-box" id="step2-Room">
            <h2>Đại Sảnh</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 20px;">Xin chào, <strong id="previewName" style="color:var(--luxury-gold)"></strong>!</p>
            
            <div class="room-actions">
                <div class="action-card">
                    <label>TẠO PHÒNG MỚI (Host)</label>
                    <input type="text" id="createRoomInput" placeholder="Nhập tên phòng..." onkeypress="if(event.key === 'Enter') handleCreateRoom()">
                    <button class="btn-gold" onclick="handleCreateRoom()">Tạo Phòng Live</button>
                </div>
                <div class="action-card">
                    <label>VÀO PHÒNG CÓ SẴN (Khách / Xem)</label>
                    <input type="text" id="joinRoomInput" placeholder="Nhập ID phòng bạn bè..." onkeypress="if(event.key === 'Enter') handleJoinRoom()">
                    <button class="btn-dark" onclick="handleJoinRoom()">Tham Gia Phòng</button>
                </div>
            </div>
            <p id="modalStatus" style="color: var(--luxury-maroon); font-size: 13px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <h1>♛ Hệ Thống Live Stream Pro ♛</h1>
    <div class="main-layout" id="mainLayout">
        
        <!-- CỘT TRÁI -->
        <div class="panel">
            <h3>BẢNG ĐIỀU KHIỂN</h3>
            <div class="badge" id="roomInfoBadge">Đang tải thông tin...</div>

            <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 15px 0;" id="liveDivider">
                
            <div id="streamingControlArea">
                <h3>CẤU HÌNH LIVE</h3>
                <p style="font-size: 11px; color: var(--luxury-grey-medium); margin-top: 0;">*Chỉ dành cho máy tính (Win/Mac).</p>
                
                <div class="control-group">
                    <label>Độ Nét tối thiểu (Resolution):</label>
                    <select id="resSelect">
                        <option value="720">720p - Tiêu chuẩn (HD)</option>
                        <option value="1080" selected>1080p - Sắc nét (Full HD)</option>
                    </select>
                </div>
                <div class="flex-row control-group">
                    <div>
                        <label>FPS:</label>
                        <select id="fpsSelect">
                            <option value="30">30</option>
                            <option value="60" selected>60</option>
                        </select>
                    </div>
                    <div>
                        <label>Bitrate:</label>
                        <select id="bitrateSelect">
                            <option value="5000000">5 Mbps</option>
                            <option value="8000000">8 Mbps</option>
                            <option value="15000000" selected>15 Mbps</option>
                        </select>
                    </div>
                </div>

                <button class="btn-gold" id="btnStartStream" style="margin-top: 10px;">🔴 Phát Màn Hình</button>
                <button class="btn-maroon" id="btnStopStream" style="display:none; margin-top: 10px;">⬛ Dừng Phát</button>
            </div>
        </div>

        <!-- CỘT GIỮA -->
        <div class="video-grid" id="videoGrid"></div>

        <!-- CỘT PHẢI -->
        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Chào mừng bạn đã vào phòng!</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn...">
                    <button class="btn-gold" id="btnSendChat" style="width: 80px;">Gửi</button>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--luxury-grey-medium);">
                <p>Thành viên trong phòng: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong></p>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let myUsername = "";
        let isHost = false;
        let currentRoomName = "";
        
        let myStream = null;
        let connectedPeers = new Set();  
        let peerUsernames = {};          
        let dataConnections = {};        
        let mediaCalls = {};             

        const peerConfig = { config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] } };

        // Hàm kiểm tra thiết bị di động
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // ==========================================
        // 1. GIAO DIỆN & POPUP FLOW
        // ==========================================
        function goToStep2() {
            const input = document.getElementById('welcomeNameInput').value.trim();
            if (!input) return alert("Bạn chưa nhập tên!");
            myUsername = input;
            document.getElementById('step1-Name').style.display = 'none';
            document.getElementById('step2-Room').style.display = 'block';
            document.getElementById('previewName').innerText = myUsername;
        }

        function handleCreateRoom() {
            const rName = document.getElementById('createRoomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng muốn tạo!");
            currentRoomName = rName;
            initPeer('room-' + rName, true);
        }

        function handleJoinRoom() {
            const rName = document.getElementById('joinRoomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập ID phòng muốn vào!");
            currentRoomName = rName;
            initPeer(null, false, rName);
        }

        function enterMainRoom() {
            document.getElementById('overlayModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlayModal').style.display = 'none';
                document.getElementById('mainLayout').style.display = 'grid';
            }, 500);

            const role = isHost ? "Chủ Phòng (Host ♛)" : "Khách xem";
            document.getElementById('roomInfoBadge').innerHTML = `Biệt danh: <strong>${myUsername}</strong><br>Phòng: <strong>${currentRoomName}</strong><br>Vai trò: <strong>${role}</strong>`;

            // Nếu là điện thoại, ẩn luôn phần điều khiển phát live cho gọn giao diện
            if (isMobileDevice()) {
                document.getElementById('streamingControlArea').style.display = 'none';
                document.getElementById('liveDivider').style.display = 'none';
            }
        }

        // ==========================================
        // CẬP NHẬT CẤU HÌNH LIVE "NÓNG"
        // ==========================================
        async function updateLiveQuality() {
            if (!myStream) return; 
            
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            const bitVal = parseInt(document.getElementById('bitrateSelect').value);
            
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }

            try {
                const videoTrack = myStream.getVideoTracks()[0];
                if (videoTrack) {
                    await videoTrack.applyConstraints({
                        width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fpsVal, max: fpsVal }
                    });
                }
            } catch (e) { console.warn("Lỗi ép Constraints:", e); }

            for (let id in mediaCalls) {
                const call = mediaCalls[id];
                if (!call.peerConnection) continue;
                try {
                    const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        const params = sender.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        params.encodings[0].maxBitrate = bitVal; 
                        params.degradationPreference = 'maintain-resolution'; 
                        await sender.setParameters(params);
                    }
                } catch (e) { console.error("Lỗi cập nhật mạng:", e); }
            }
            
            sysLog(`⚙️ Đã áp dụng: ${resVal}p | ${fpsVal}FPS | ${bitVal/1000000}Mbps`);
        }

        document.getElementById('resSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('fpsSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('bitrateSelect').addEventListener('change', updateLiveQuality);


        // ==========================================
        // MẠNG LƯỚI PEERJS (P2P MESH)
        // ==========================================
        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy();
            const modalStatus = document.getElementById('modalStatus');
            modalStatus.innerText = "Đang kết nối server...";
            
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id; isHost = hostMode;
                if(isHost && !myUsername.includes("Host")) myUsername += " ♛";
                peerUsernames[myId] = myUsername; 
                
                enterMainRoom();

                if (!isHost) {
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
                updateMemberCount();
            });

            peer.on('connection', (conn) => { setupDataConnection(conn); });

            peer.on('call', (call) => {
                call.answer(myStream); 
                updateLiveQuality();
                
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream);
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') modalStatus.innerText = "❌ Tên phòng đã tồn tại. Thử tên khác.";
                else if (err.type === 'peer-unavailable') modalStatus.innerText = "❌ Không tìm thấy phòng!";
                else console.error(err);
            });
        }

        function setupDataConnection(conn) {
            conn.on('open', () => {
                connectedPeers.add(conn.peer); dataConnections[conn.peer] = conn;
                conn.send({ type: 'HANDSHAKE', username: myUsername });
                
                setTimeout(() => { if(conn.open) conn.send({ type: 'REQUEST_STREAM' }); }, 1000);

                if (isHost) {
                    const peersData = Array.from(connectedPeers)
                        .filter(id => id !== conn.peer)
                        .map(id => ({ id: id, username: peerUsernames[id] || "Khách" }));
                    conn.send({ type: 'PEER_LIST', peers: peersData });

                    peersData.forEach(p => {
                        if(dataConnections[p.id]) {
                            dataConnections[p.id].send({ type: 'NEW_PEER', peer: conn.peer, username: peerUsernames[conn.peer] || "Khách" });
                        }
                    });
                }
                updateMemberCount();
            });

            conn.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    peerUsernames[conn.peer] = data.username;
                    sysLog(`<strong>${data.username}</strong> đã vào phòng.`);
                    updateVideoLabel(conn.peer);
                }
                else if (data.type === 'REQUEST_STREAM') {
                    if (myStream) {
                        mediaCalls[conn.peer] = peer.call(conn.peer, myStream);
                        updateLiveQuality();
                    }
                }
                else if (data.type === 'PEER_LIST' || data.type === 'NEW_PEER') {
                    const processPeer = (pId, pName) => {
                        peerUsernames[pId] = pName;
                        if (pId !== myId && !dataConnections[pId]) setupDataConnection(peer.connect(pId));
                    };
                    if (data.type === 'PEER_LIST') data.peers.forEach(p => processPeer(p.id, p.username));
                    else processPeer(data.peer, data.username);
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
            });

            conn.on('close', () => {
                const name = peerUsernames[conn.peer] || "Một người";
                if (conn.peer.startsWith('room-')) sysWarn(`⚠️ CẢNH BÁO: Chủ phòng (${name}) đã thoát!`);
                else sysLog(`<strong>${name}</strong> rời phòng.`);
                
                connectedPeers.delete(conn.peer);
                delete dataConnections[conn.peer];
                delete peerUsernames[conn.peer];
                delete mediaCalls[conn.peer];
                removeVideoStream(conn.peer);
                updateMemberCount();
            });
        }

        // ==========================================
        // PHÁT LIVE & CHẶN MOBILE
        // ==========================================
        document.getElementById('btnStartStream').addEventListener('click', async () => {
            // KIỂM TRA NẾU LÀ ĐIỆN THOẠI THÌ BÁO LỖI YÊU CẦU
            if (isMobileDevice()) {
                alert("Hệ thống chỉ dùng được bởi trình duyệt trên Win or Mac");
                return;
            }

            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }

            try {
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fpsVal, max: fpsVal } },
                    audio: true
                });
                if (myStream.getVideoTracks()[0]) myStream.getVideoTracks()[0].contentHint = 'detail';

                addVideoStream('me', myStream, true);

                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';

                myStream.getVideoTracks()[0].onended = stopStream;

                connectedPeers.forEach(id => {
                    mediaCalls[id] = peer.call(id, myStream);
                });
                
                setTimeout(() => updateLiveQuality(), 500);

            } catch (err) { console.error("Lỗi màn hình:", err); }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            removeVideoStream('me');
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            mediaCalls = {};
        }

        // HÀM HIỂN THỊ VIDEO VỚI CƠ CHẾ "CLICK ĐỂ XEM"
        function addVideoStream(id, stream, isMe = false) {
            if (document.getElementById('video-wrap-' + id)) {
                document.getElementById('video-' + id).srcObject = stream;
                return;
            }

            const wrap = document.createElement('div'); wrap.className = 'video-wrapper'; wrap.id = 'video-wrap-' + id;
            
            const vid = document.createElement('video'); vid.id = 'video-' + id; vid.srcObject = stream;
            vid.autoplay = true; vid.playsInline = true; vid.controls = !isMe;
            
            let isWatching = isMe; 
            
            if (isMe) {
                vid.muted = true; vid.id = 'video-me';
            } else {
                stream.getTracks().forEach(t => t.enabled = false);
            }

            const overlay = document.createElement('div');
            overlay.className = 'stream-overlay';
            if (isMe) overlay.style.display = 'none';
            
            const displayName = isMe ? `${myUsername} (Bạn)` : (peerUsernames[id] || `Thành viên`);
            overlay.innerHTML = `
                <div class="play-icon">▶️</div>
                <span>Bấm để xem Live của ${displayName}</span>
            `;

            const stopViewBtn = document.createElement('button');
            stopViewBtn.className = 'btn-stop-viewing';
            stopViewBtn.innerText = '⏸️ Dừng xem';
            stopViewBtn.style.display = 'none';

            const toggleStream = () => {
                isWatching = !isWatching;
                stream.getTracks().forEach(t => t.enabled = isWatching);
                
                if (isWatching) {
                    overlay.style.display = 'none';
                    stopViewBtn.style.display = 'block';
                    vid.play().catch(e => console.log("Lỗi play video:", e));
                } else {
                    overlay.style.display = 'flex';
                    stopViewBtn.style.display = 'none';
                }
            };

            overlay.onclick = toggleStream;
            stopViewBtn.onclick = toggleStream;

            const label = document.createElement('div'); label.className = 'video-label'; label.id = 'video-label-' + id;
            label.innerText = `🔴 ${displayName}`;

            wrap.appendChild(overlay);
            wrap.appendChild(stopViewBtn);
            wrap.appendChild(vid); 
            wrap.appendChild(label);
            document.getElementById('videoGrid').appendChild(wrap);
        }

        function updateVideoLabel(id) {
            const label = document.getElementById('video-label-' + id);
            if (label && peerUsernames[id]) {
                const isMe = id === myId;
                label.innerText = `🔴 ${isMe ? `${myUsername} (Bạn)` : peerUsernames[id]}`;
                
                const wrap = document.getElementById('video-wrap-' + id);
                if(wrap && !isMe) {
                    const overlaySpan = wrap.querySelector('.stream-overlay span');
                    if (overlaySpan) overlaySpan.innerText = `Bấm để xem Live của ${peerUsernames[id]}`;
                }
            }
        }

        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) {
                const vid = el.querySelector('video');
                if(vid && vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
                el.remove();
            }
        }
        function updateMemberCount() { document.getElementById('memberCount').innerText = connectedPeers.size + 1; }

        // ==========================================
        // HỆ THỐNG CHAT & CLEANUP
        // ==========================================
        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput'); const msg = input.value.trim();
            if (!msg) return;
            const dataPacket = { type: 'CHAT', sender: myUsername, msg: msg };
            appendChat("Bạn", msg); input.value = '';
            connectedPeers.forEach(id => { if (dataConnections[id] && dataConnections[id].open) dataConnections[id].send(dataPacket); });
        }

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages');
            const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            box.innerHTML += `<p><span class="sender" style="color:${color}">${sender}:</span> ${msg}</p>`;
            box.scrollTop = box.scrollHeight;
        }
        function sysLog(msg) { const b = document.getElementById('chatMessages'); b.innerHTML += `<p><span class="sys-msg">Hệ Thống:</span> ${msg}</p>`; b.scrollTop = b.scrollHeight; }
        function sysWarn(msg) { const b = document.getElementById('chatMessages'); b.innerHTML += `<p><span class="sys-warn">${msg}</span></p>`; b.scrollTop = b.scrollHeight; }

        window.addEventListener('beforeunload', () => {
            stopStream();
            if(peer) peer.destroy();
        });
    </script>
</body>
</html>
