<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Masterpiece Edition</title>
    <style>
        /* ==========================================
           BẢNG MÀU LUXURY & CSS CƠ BẢN
           ========================================== */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body { font-family: 'Poppins', sans-serif; background: #111; color: var(--luxury-grey-light); margin: 0; padding: 10px; text-align: center; overflow-x: hidden; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2em; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 5px 0 15px 0; letter-spacing: 2px; text-transform: uppercase; }

        /* ==========================================
           HỆ THỐNG POPUP VÀO PHÒNG
           ========================================== */
        #overlayModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
        .modal-box { background: var(--panel-bg); padding: 30px; border-radius: 15px; border: 2px solid var(--luxury-gold); box-shadow: 0 0 40px rgba(198, 156, 109, 0.2); width: 90%; max-width: 450px; text-align: center; animation: popIn 0.4s ease forwards; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-box h2 { font-family: 'Playfair Display', serif; color: var(--luxury-gold); margin-top: 0; font-size: 1.8em; border-bottom: 1px solid rgba(198, 156, 109, 0.3); padding-bottom: 10px; }
        .modal-box input { padding: 12px; font-size: 15px; text-align: center; margin: 10px 0; border: 1px solid var(--luxury-grey-medium); background: #000; color: var(--luxury-gold); border-radius: 8px; width: 100%; box-sizing: border-box; }
        .modal-box input:focus { border-color: var(--luxury-gold); outline: none; }
        .modal-box button { padding: 12px; font-size: 15px; width: 100%; margin-top: 10px; }
        
        .room-actions { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .action-card { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px dashed rgba(198, 156, 109, 0.4); }
        .action-card label { color: var(--luxury-gold); font-size: 13px; font-weight: bold; }
        #step2-Room { display: none; }

        /* ==========================================
           GIAO DIỆN CHÍNH (MAIN DASHBOARD)
           ========================================== */
        .main-layout { display: none; grid-template-columns: 330px 1fr 340px; gap: 15px; max-width: 1800px; margin: 0 auto; height: 88vh; }
        @media (max-width: 1000px) { .main-layout { grid-template-columns: 1fr; height: auto; } }

        /* PANELS */
        .panel { background: var(--panel-bg); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; border: 1px solid rgba(198, 156, 109, 0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: left; display: flex; flex-direction: column; gap: 10px; }
        .panel h3 { font-family: 'Playfair Display', serif; margin: 0 0 5px 0; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.2em; border-bottom: 1px solid var(--luxury-maroon); padding-bottom: 5px; text-align: center; }
        .control-group { margin-bottom: 2px; }
        .control-group label { font-size: 12px; color: var(--luxury-gold); margin-bottom: 3px; display: block;}
        select, input { padding: 8px; border-radius: 6px; border: 1px solid var(--luxury-grey-medium); font-size: 12px; width: 100%; box-sizing: border-box; background: #0a0a0a; color: var(--luxury-gold); }
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }
        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        /* BUTTONS */
        button { padding: 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase; }
        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 10px rgba(198, 156, 109, 0.5); transform: translateY(-1px); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-icon { background: none; border: 1px solid var(--luxury-gold); color: var(--luxury-gold); padding: 5px; width: auto; font-size: 14px; border-radius: 4px; }
        .btn-icon:hover { background: var(--luxury-gold); color: #000; }

        /* KHU VỰC VIDEO GRID */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; align-content: start; padding: 10px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px dashed rgba(198, 156, 109, 0.3); overflow-y: auto; }
        .video-wrapper { position: relative; background: #000; border-radius: 8px; border: 2px solid var(--luxury-gold); overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 5px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }
        
        .stream-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 15; cursor: pointer; transition: 0.3s; }
        .stream-overlay:hover { background: rgba(0,0,0,0.7); }
        .stream-overlay .play-icon { font-size: 3em; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--luxury-gold)); }
        .stream-overlay span { color: var(--luxury-gold); font-weight: bold; font-size: 13px; text-align: center; padding: 0 10px;}
        
        .video-controls { position: absolute; top: 10px; right: 10px; z-index: 20; display: flex; gap: 5px; }
        .btn-vid-ctrl { background: rgba(0,0,0,0.7); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-vid-ctrl:hover { background: var(--luxury-gold); color: #000; }
        .btn-stop-viewing { background: rgba(141, 28, 28, 0.8); color: white; border: 1px solid var(--luxury-maroon); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.85); color: var(--luxury-gold); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(198, 156, 109, 0.5); z-index: 20; }

        /* KHU VỰC CHAT & THÀNH VIÊN */
        .chat-box { flex: 1; display: flex; flex-direction: column; overflow:hidden;}
        .chat-messages { flex: 1; overflow-y: auto; background: #0a0a0a; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; border: 1px solid rgba(198, 156, 109, 0.2); }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; word-break: break-word;}
        .chat-messages img { max-width: 100%; border-radius: 4px; margin-top: 5px; border: 1px solid var(--luxury-gold); }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }
        
        .badge { background: #000; color: var(--luxury-gold); padding: 8px; text-align: center; border-radius: 6px; border: 1px dashed var(--luxury-gold); margin-bottom: 5px; font-size: 12px;}
        
        .member-list-container { background: #000; border: 1px solid var(--luxury-grey-medium); border-radius: 6px; max-height: 120px; overflow-y: auto; padding: 5px; margin-top: 5px; font-size: 12px; display: none; }
        .member-item { display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px solid #333; }
        .btn-kick { background: var(--luxury-maroon); color: white; padding: 2px 6px; font-size: 10px; border-radius: 4px; width: auto; }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="overlayModal">
        <div class="modal-box" id="step1-Name">
            <h2>♛ Kính Chào ♛</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 20px;">Vui lòng nhập biệt danh của bạn</p>
            <input type="text" id="welcomeNameInput" placeholder="VD: GamerPro99" onkeypress="if(event.key === 'Enter') goToStep2()">
            <button class="btn-gold" onclick="goToStep2()">Tiếp Tục</button>
        </div>

        <div class="modal-box" id="step2-Room">
            <h2>Đại Sảnh</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 15px;">Xin chào, <strong id="previewName" style="color:var(--luxury-gold)"></strong>!</p>
            
            <div class="room-actions">
                <div class="action-card">
                    <label>TẠO PHÒNG MỚI (Host)</label>
                    <input type="text" id="createRoomInput" placeholder="Tên phòng..." style="margin-bottom: 5px;">
                    <input type="password" id="createRoomPass" placeholder="Mật khẩu (Bỏ trống = Công khai)" style="margin-top: 0;">
                    <button class="btn-gold" onclick="handleCreateRoom()">Tạo Phòng Live</button>
                </div>
                <div class="action-card">
                    <label>VÀO PHÒNG CÓ SẴN (Khách)</label>
                    <input type="text" id="joinRoomInput" placeholder="Nhập ID phòng bạn bè..." style="margin-bottom: 5px;">
                    <input type="password" id="joinRoomPass" placeholder="Mật khẩu (Nếu có)" style="margin-top: 0;" onkeypress="if(event.key === 'Enter') handleJoinRoom()">
                    <button class="btn-dark" onclick="handleJoinRoom()">Tham Gia Phòng</button>
                </div>
            </div>
            <p id="modalStatus" style="color: var(--luxury-maroon); font-size: 13px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <h1>♛ Hệ Thống Live Stream Pro ♛</h1>
    <div class="main-layout" id="mainLayout">
        
        <div class="panel">
            <h3>BẢNG ĐIỀU KHIỂN</h3>
            <div class="badge" id="roomInfoBadge">Đang tải thông tin...</div>

            <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 10px 0;" id="liveDivider">
                
            <div id="streamingControlArea">
                <h3>CẤU HÌNH LIVE</h3>
                
                <div class="control-group">
                    <label>Nguồn Phát:</label>
                    <select id="sourceSelect">
                        <option value="screen">🖥️ Chia sẻ Màn Hình</option>
                        <option value="camera">📷 Chia sẻ Camera (Webcam)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Độ Nét (Resolution):</label>
                    <select id="resSelect">
                        <option value="720">720p - Tiêu chuẩn (HD)</option>
                        <option value="1080" selected>1080p - Sắc nét (Full HD)</option>
                    </select>
                </div>
                <div class="flex-row control-group">
                    <div>
                        <label>FPS:</label>
                        <select id="fpsSelect">
                            <option value="30">30</option>
                            <option value="60" selected>60</option>
                        </select>
                    </div>
                    <div>
                        <label>Bitrate:</label>
                        <select id="bitrateSelect">
                            <option value="2500000">2.5 Mbps</option>
                            <option value="8000000">8 Mbps</option>
                            <option value="15000000" selected>15 Mbps</option>
                        </select>
                    </div>
                </div>

                <div class="flex-row" style="margin-top: 10px;">
                    <button class="btn-gold" id="btnStartStream">🔴 Bắt Đầu Live</button>
                    <button class="btn-dark" id="btnToggleMic" style="display:none; width:50px;" title="Bật/Tắt Mic">🎤</button>
                </div>
                <button class="btn-maroon" id="btnStopStream" style="display:none; margin-top: 8px;">⬛ Dừng Phát</button>
            </div>
        </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            
            <div style="font-size: 12px; color: var(--luxury-grey-medium); cursor: pointer; text-align: right;" onclick="toggleMemberList()">
                👥 Thành viên: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong> (Bấm để xem)
            </div>
            <div class="member-list-container" id="memberList"></div>

            <div class="chat-box" style="margin-top: 10px;">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Chào mừng bạn đã vào phòng!</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="file" id="fileInput" style="display:none;" accept="image/*">
                    <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Gửi ảnh">📎</button>
                    
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." style="margin-bottom:0;">
                    <button class="btn-gold" id="btnSendChat" style="width: 70px; margin-top:0;">Gửi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let myUsername = "";
        let isHost = false;
        let currentRoomName = "";
        let myRoomPassword = "";
        
        let myStream = null;
        let isMicMuted = false;
        
        let connectedPeers = new Set();  
        let peerUsernames = {};          
        let dataConnections = {};        
        let mediaCalls = {};             

        const peerConfig = { config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] } };
        const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // ==========================================
        // 1. GIAO DIỆN & POPUP & PASSWORD
        // ==========================================
        function goToStep2() {
            const input = document.getElementById('welcomeNameInput').value.trim();
            if (!input) return alert("Bạn chưa nhập tên!");
            myUsername = input;
            document.getElementById('step1-Name').style.display = 'none';
            document.getElementById('step2-Room').style.display = 'block';
            document.getElementById('previewName').innerText = myUsername;
        }

        function handleCreateRoom() {
            const rName = document.getElementById('createRoomInput').value.trim();
            myRoomPassword = document.getElementById('createRoomPass').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng muốn tạo!");
            currentRoomName = rName;
            initPeer('room-' + rName, true);
        }

        function handleJoinRoom() {
            const rName = document.getElementById('joinRoomInput').value.trim();
            myRoomPassword = document.getElementById('joinRoomPass').value.trim();
            if(!rName) return alert("Vui lòng nhập ID phòng muốn vào!");
            currentRoomName = rName;
            initPeer(null, false, rName);
        }

        function enterMainRoom() {
            document.getElementById('overlayModal').style.opacity = '0';
            setTimeout(() => { document.getElementById('overlayModal').style.display = 'none'; document.getElementById('mainLayout').style.display = 'grid'; }, 500);

            const role = isHost ? "Chủ Phòng (Host ♛)" : "Khách";
            const lockIcon = myRoomPassword ? "🔒 Có Pass" : "🔓 Công khai";
            document.getElementById('roomInfoBadge').innerHTML = `Biệt danh: <strong>${myUsername}</strong><br>Phòng: <strong>${currentRoomName}</strong> (${lockIcon})<br>Vai trò: <strong>${role}</strong>`;

            if (isMobileDevice()) {
                document.getElementById('streamingControlArea').style.display = 'none';
                document.getElementById('liveDivider').style.display = 'none';
            }
            updateMemberListUI();
        }

        // ==========================================
        // CẬP NHẬT CẤU HÌNH LIVE "NÓNG"
        // ==========================================
        async function updateLiveQuality() {
            if (!myStream) return; 
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            const bitVal = parseInt(document.getElementById('bitrateSelect').value);
            let w = 1280, h = 720; if(resVal === 1080) { w = 1920; h = 1080; }

            try {
                const videoTrack = myStream.getVideoTracks()[0];
                if (videoTrack) await videoTrack.applyConstraints({ width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fpsVal, max: fpsVal } });
            } catch (e) {}

            for (let id in mediaCalls) {
                const call = mediaCalls[id];
                if (!call.peerConnection) continue;
                try {
                    const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        const params = sender.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        params.encodings[0].maxBitrate = bitVal; 
                        params.degradationPreference = 'maintain-resolution'; 
                        await sender.setParameters(params);
                    }
                } catch (e) {}
            }
        }

        document.getElementById('resSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('fpsSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('bitrateSelect').addEventListener('change', updateLiveQuality);

        // ==========================================
        // MẠNG LƯỚI & XÁC THỰC MẬT KHẨU & KICK
        // ==========================================
        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy();
            const modalStatus = document.getElementById('modalStatus');
            modalStatus.innerText = "Đang kết nối server...";
            
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id; isHost = hostMode;
                if(isHost && !myUsername.includes("Host")) myUsername += " ♛";
                peerUsernames[myId] = myUsername; 
                
                enterMainRoom();

                if (!isHost) {
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
            });

            peer.on('connection', (conn) => { setupDataConnection(conn); });
            peer.on('call', (call) => {
                call.answer(myStream); updateLiveQuality();
                call.on('stream', (remoteStream) => addVideoStream(call.peer, remoteStream));
            });
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') modalStatus.innerText = "❌ Tên phòng đã tồn tại.";
                else if (err.type === 'peer-unavailable') modalStatus.innerText = "❌ Không tìm thấy phòng!";
            });
        }

        function setupDataConnection(conn) {
            conn.on('open', () => {
                // Khách Gửi Handshake kèm Password
                conn.send({ type: 'HANDSHAKE', username: myUsername, password: myRoomPassword });
            });

            conn.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    // Host kiểm tra pass
                    if (isHost) {
                        if (myRoomPassword && data.password !== myRoomPassword) {
                            conn.send({ type: 'KICK', reason: 'Sai mật khẩu phòng!' });
                            setTimeout(() => conn.close(), 500);
                            return;
                        }
                    }
                    // Pass đúng hoặc không có pass -> Chấp nhận
                    connectedPeers.add(conn.peer); dataConnections[conn.peer] = conn;
                    peerUsernames[conn.peer] = data.username;
                    sysLog(`<strong>${data.username}</strong> đã vào phòng.`);
                    updateVideoLabel(conn.peer); updateMemberListUI();
                    
                    setTimeout(() => { if(conn.open) conn.send({ type: 'REQUEST_STREAM' }); }, 1000);

                    // Host phân phát danh sách
                    if (isHost) {
                        const peersData = Array.from(connectedPeers).filter(id => id !== conn.peer).map(id => ({ id: id, username: peerUsernames[id] }));
                        conn.send({ type: 'PEER_LIST', peers: peersData });
                        peersData.forEach(p => {
                            if(dataConnections[p.id]) dataConnections[p.id].send({ type: 'NEW_PEER', peer: conn.peer, username: data.username });
                        });
                    }
                }
                else if (data.type === 'KICK') {
                    alert("Bị ngắt kết nối: " + data.reason);
                    location.reload(); // Reset lại web
                }
                else if (data.type === 'REQUEST_STREAM') {
                    if (myStream) { mediaCalls[conn.peer] = peer.call(conn.peer, myStream); updateLiveQuality(); }
                }
                else if (data.type === 'PEER_LIST' || data.type === 'NEW_PEER') {
                    const processPeer = (pId, pName) => {
                        peerUsernames[pId] = pName;
                        if (pId !== myId && !dataConnections[pId]) {
                            const newConn = peer.connect(pId);
                            // Cần gán dữ liệu chờ Handshake (Mô phỏng đơn giản)
                            dataConnections[pId] = newConn; connectedPeers.add(pId); setupDataConnection(newConn);
                        }
                    };
                    if (data.type === 'PEER_LIST') data.peers.forEach(p => processPeer(p.id, p.username));
                    else processPeer(data.peer, data.username);
                    updateMemberListUI();
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
                else if (data.type === 'FILE') {
                    appendFileChat(data.sender, data.name, data.data, data.isImage);
                }
            });

            conn.on('close', () => {
                const name = peerUsernames[conn.peer] || "Một người";
                if (conn.peer.startsWith('room-')) sysLog(`<span style="color:#ff9f43">⚠️ Chủ phòng (${name}) đã thoát!</span>`);
                else sysLog(`<strong>${name}</strong> rời phòng.`);
                
                connectedPeers.delete(conn.peer); delete dataConnections[conn.peer]; delete peerUsernames[conn.peer]; delete mediaCalls[conn.peer];
                removeVideoStream(conn.peer); updateMemberListUI();
            });
        }

        // --- HOST KICK USER ---
        function kickUser(peerId) {
            if (confirm(`Bạn muốn đuổi ${peerUsernames[peerId]} ra khỏi phòng?`)) {
                if (dataConnections[peerId]) {
                    dataConnections[peerId].send({ type: 'KICK', reason: 'Bị chủ phòng kick ra ngoài!' });
                    setTimeout(() => dataConnections[peerId].close(), 500);
                }
            }
        }

        function toggleMemberList() {
            const el = document.getElementById('memberList');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function updateMemberListUI() {
            document.getElementById('memberCount').innerText = connectedPeers.size + 1;
            const list = document.getElementById('memberList');
            list.innerHTML = `<div class="member-item"><span>${myUsername} (Bạn)</span></div>`;
            
            connectedPeers.forEach(id => {
                const btnKick = isHost ? `<button class="btn-kick" onclick="kickUser('${id}')">X</button>` : '';
                list.innerHTML += `<div class="member-item"><span>${peerUsernames[id] || id}</span> ${btnKick}</div>`;
            });
        }

        // ==========================================
        // PHÁT LIVE & CAMERA & MIC
        // ==========================================
        document.getElementById('btnToggleMic').addEventListener('click', () => {
            if (myStream) {
                isMicMuted = !isMicMuted;
                myStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
                document.getElementById('btnToggleMic').innerText = isMicMuted ? "🔇" : "🎤";
                document.getElementById('btnToggleMic').style.background = isMicMuted ? "var(--luxury-maroon)" : "var(--luxury-black)";
            }
        });

        document.getElementById('btnStartStream').addEventListener('click', async () => {
            if (isMobileDevice()) return alert("Hệ thống phát live chỉ dùng cho Win/Mac");
            
            const source = document.getElementById('sourceSelect').value;
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            let w = 1280, h = 720; if(resVal === 1080) { w = 1920; h = 1080; }

            try {
                if (source === 'screen') {
                    myStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fpsVal, max: fpsVal } }, audio: true });
                    if (myStream.getVideoTracks()[0]) myStream.getVideoTracks()[0].contentHint = 'detail';
                } else {
                    myStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fpsVal } }, audio: true });
                }

                addVideoStream('me', myStream, true);

                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';
                document.getElementById('btnToggleMic').style.display = 'block';
                isMicMuted = false; document.getElementById('btnToggleMic').innerText = "🎤";

                myStream.getVideoTracks()[0].onended = stopStream;

                connectedPeers.forEach(id => { mediaCalls[id] = peer.call(id, myStream); });
                setTimeout(() => updateLiveQuality(), 500);

            } catch (err) { console.error("Lỗi Camera/Màn hình:", err); }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null; }
            removeVideoStream('me');
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            document.getElementById('btnToggleMic').style.display = 'none';
            mediaCalls = {};
        }

        // HÀM HIỂN THỊ VIDEO + PIP + FULLSCREEN
        function addVideoStream(id, stream, isMe = false) {
            if (document.getElementById('video-wrap-' + id)) { document.getElementById('video-' + id).srcObject = stream; return; }

            const wrap = document.createElement('div'); wrap.className = 'video-wrapper'; wrap.id = 'video-wrap-' + id;
            const vid = document.createElement('video'); vid.id = 'video-' + id; vid.srcObject = stream;
            vid.autoplay = true; vid.playsInline = true; vid.controls = false; // Tắt controls mặc định
            
            let isWatching = isMe; 
            if (isMe) { vid.muted = true; vid.id = 'video-me'; } 
            else { stream.getTracks().forEach(t => t.enabled = false); }

            const overlay = document.createElement('div'); overlay.className = 'stream-overlay'; if (isMe) overlay.style.display = 'none';
            const displayName = isMe ? `${myUsername} (Bạn)` : (peerUsernames[id] || `Thành viên`);
            overlay.innerHTML = `<div class="play-icon">▶️</div><span>Bấm để xem ${displayName}</span>`;

            // Cụm Nút Điều Khiển Video
            const controlsDiv = document.createElement('div'); controlsDiv.className = 'video-controls'; controlsDiv.style.display = 'none';
            
            const btnPip = document.createElement('button'); btnPip.className = 'btn-vid-ctrl'; btnPip.innerText = '🔲 PiP';
            btnPip.onclick = (e) => { e.stopPropagation(); vid.requestPictureInPicture(); };
            
            const btnFull = document.createElement('button'); btnFull.className = 'btn-vid-ctrl'; btnFull.innerText = '⛶ Toàn màn hình';
            btnFull.onclick = (e) => { e.stopPropagation(); if (vid.requestFullscreen) vid.requestFullscreen(); else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen(); };

            const stopViewBtn = document.createElement('button'); stopViewBtn.className = 'btn-stop-viewing'; stopViewBtn.innerText = '⏸️ Dừng xem';

            controlsDiv.appendChild(btnPip); controlsDiv.appendChild(btnFull); controlsDiv.appendChild(stopViewBtn);

            const toggleStream = () => {
                isWatching = !isWatching; stream.getTracks().forEach(t => t.enabled = isWatching);
                if (isWatching) {
                    overlay.style.display = 'none'; controlsDiv.style.display = 'flex';
                    vid.play().catch(e => {});
                } else {
                    overlay.style.display = 'flex'; controlsDiv.style.display = 'none';
                }
            };

            overlay.onclick = toggleStream; stopViewBtn.onclick = (e) => { e.stopPropagation(); toggleStream(); };

            const label = document.createElement('div'); label.className = 'video-label'; label.id = 'video-label-' + id; label.innerText = `🔴 ${displayName}`;

            wrap.appendChild(overlay); wrap.appendChild(controlsDiv); wrap.appendChild(vid); wrap.appendChild(label);
            document.getElementById('videoGrid').appendChild(wrap);
        }

        function updateVideoLabel(id) {
            const label = document.getElementById('video-label-' + id);
            if (label && peerUsernames[id]) {
                const isMe = id === myId; label.innerText = `🔴 ${isMe ? `${myUsername} (Bạn)` : peerUsernames[id]}`;
                const wrap = document.getElementById('video-wrap-' + id);
                if(wrap && !isMe) { const span = wrap.querySelector('.stream-overlay span'); if (span) span.innerText = `Bấm để xem ${peerUsernames[id]}`; }
            }
        }

        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) { const vid = el.querySelector('video'); if(vid && vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop()); el.remove(); }
        }

        // ==========================================
        // GỬI FILE & CHAT
        // ==========================================
        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput'); const msg = input.value.trim();
            if (!msg) return;
            const dataPacket = { type: 'CHAT', sender: myUsername, msg: msg };
            appendChat("Bạn", msg); input.value = '';
            connectedPeers.forEach(id => { if (dataConnections[id] && dataConnections[id].open) dataConnections[id].send(dataPacket); });
        }

        document.getElementById('fileInput').addEventListener('change', function() {
            const file = this.files[0];
            if(!file) return;
            if(file.size > 2 * 1024 * 1024) return alert("Vui lòng gửi ảnh dưới 2MB để truyền tải nhanh nhất.");
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const b64 = e.target.result;
                const isImg = file.type.startsWith('image/');
                const dataPacket = { type: 'FILE', sender: myUsername, name: file.name, data: b64, isImage: isImg };
                appendFileChat("Bạn", file.name, b64, isImg);
                connectedPeers.forEach(id => { if (dataConnections[id] && dataConnections[id].open) dataConnections[id].send(dataPacket); });
                document.getElementById('fileInput').value = ''; // reset
            };
            reader.readAsDataURL(file);
        });

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages'); const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            box.innerHTML += `<p><span class="sender" style="color:${color}">${sender}:</span> ${msg}</p>`; box.scrollTop = box.scrollHeight;
        }

        function appendFileChat(sender, fileName, fileData, isImage) {
            const box = document.getElementById('chatMessages'); const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            let content = isImage ? `<br><img src="${fileData}" alt="${fileName}">` : `<br>📎 <a href="${fileData}" download="${fileName}" style="color:#4ecdc4;">Tải file: ${fileName}</a>`;
            box.innerHTML += `<p><span class="sender" style="color:${color}">${sender}:</span> đã gửi một tệp đính kèm.${content}</p>`;
            box.scrollTop = box.scrollHeight;
        }

        function sysLog(msg) { const b = document.getElementById('chatMessages'); b.innerHTML += `<p><span class="sys-msg">Hệ Thống:</span> ${msg}</p>`; b.scrollTop = b.scrollHeight; }
        
        window.addEventListener('beforeunload', () => { stopStream(); if(peer) peer.destroy(); });
    </script>
</body>
</html>
