<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Ultimate UX</title>
    <style>
        /* ==========================================
           BẢNG MÀU LUXURY & CSS CƠ BẢN
           ========================================== */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: var(--luxury-grey-light);
            margin: 0;
            padding: 15px;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            letter-spacing: 2px;
        }

        /* ==========================================
           HỆ THỐNG POPUP (BƯỚC 1 & BƯỚC 2)
           ========================================== */
        #overlayModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .modal-box {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--luxury-gold);
            box-shadow: 0 0 40px rgba(198, 156, 109, 0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn { 
            from { transform: scale(0.8); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }

        .modal-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--luxury-gold);
            margin-top: 0;
            font-size: 2em;
            border-bottom: 1px solid rgba(198, 156, 109, 0.3);
            padding-bottom: 15px;
        }

        .modal-box input {
            padding: 15px;
            font-size: 16px;
            text-align: center;
            margin: 15px 0;
            border: 1px solid var(--luxury-grey-medium);
            background: #000;
            color: var(--luxury-gold);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .modal-box input:focus { border-color: var(--luxury-gold); outline: none; }

        .modal-box button {
            padding: 15px;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .action-card {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed rgba(198, 156, 109, 0.4);
        }

        .action-card label {
            color: var(--luxury-gold);
            font-size: 13px;
            font-weight: bold;
        }

        /* Ẩn hiện các bước */
        #step2-Room { display: none; }

        /* ==========================================
           BỐ CỤC CHÍNH (GIAO DIỆN SAU KHI VÀO PHÒNG)
           ========================================== */
        .main-layout {
            display: none;
            grid-template-columns: 320px 1fr 320px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            height: 85vh;
        }

        /* PANEL CÔNG CỤ */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(198, 156, 109, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 5px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3em;
            border-bottom: 1px solid var(--luxury-maroon);
            padding-bottom: 8px;
            text-align: center;
        }

        .control-group { margin-bottom: 5px; }
        .control-group label { font-size: 13px; color: var(--luxury-gold); margin-bottom: 5px; display: block;}
        
        select, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--luxury-grey-medium);
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            background: #0a0a0a;
            color: var(--luxury-gold);
        }
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }

        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        /* BUTTONS */
        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(198, 156, 109, 0.5); transform: translateY(-2px); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }

        /* KHU VỰC VIDEO GRID */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            align-content: start;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(198, 156, 109, 0.3);
            overflow-y: auto;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            border: 2px solid var(--luxury-gold);
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }

        .video-label {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.85);
            color: var(--luxury-gold);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px; font-weight: bold;
            border: 1px solid rgba(198, 156, 109, 0.5);
        }

        /* KHU VỰC CHAT */
        .chat-box { flex: 1; display: flex; flex-direction: column; overflow:hidden;}
        .chat-messages {
            flex: 1; overflow-y: auto;
            background: #0a0a0a; padding: 10px;
            border-radius: 6px; margin-bottom: 10px;
            font-size: 13px; border: 1px solid rgba(198, 156, 109, 0.2);
        }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }
        .sys-warn { color: #ff9f43; font-style: italic; font-weight: bold; }
        
        .badge { background: #000; color: var(--luxury-gold); padding: 8px; text-align: center; border-radius: 6px; border: 1px dashed var(--luxury-gold); margin-bottom: 10px; font-size: 13px;}

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="overlayModal">
        <div class="modal-box" id="step1-Name">
            <h2>♛ Kính Chào ♛</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 20px;">Vui lòng nhập biệt danh để tiếp tục</p>
            <input type="text" id="welcomeNameInput" placeholder="VD: GamerPro99" onkeypress="if(event.key === 'Enter') goToStep2()">
            <button class="btn-gold" onclick="goToStep2()">Tiếp Tục</button>
        </div>

        <div class="modal-box" id="step2-Room">
            <h2>Đại Sảnh</h2>
            <p style="color: var(--luxury-grey-light); margin-bottom: 20px;">Xin chào, <strong id="previewName" style="color:var(--luxury-gold)"></strong>!</p>
            
            <div class="room-actions">
                <div class="action-card">
                    <label>TẠO PHÒNG MỚI (Host)</label>
                    <input type="text" id="createRoomInput" placeholder="Nhập tên phòng muốn tạo mới..." onkeypress="if(event.key === 'Enter') handleCreateRoom()">
                    <button class="btn-gold" onclick="handleCreateRoom()">Tạo Phòng Live</button>
                </div>
                
                <div class="action-card">
                    <label>VÀO PHÒNG CÓ SẴN (Khách)</label>
                    <input type="text" id="joinRoomInput" placeholder="Nhập ID phòng của bạn bè..." onkeypress="if(event.key === 'Enter') handleJoinRoom()">
                    <button class="btn-dark" onclick="handleJoinRoom()">Tham Gia Phòng</button>
                </div>
            </div>

            <p id="modalStatus" style="color: var(--luxury-maroon); font-size: 13px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <div class="main-layout" id="mainLayout">
        
        <div class="panel">
            <h3>BẢNG ĐIỀU KHIỂN</h3>
            <div class="badge" id="roomInfoBadge">Đang tải thông tin...</div>

            <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 10px 0;">
                
            <h3>CẤU HÌNH LIVE PRO</h3>
            <p style="font-size: 11px; color: var(--luxury-grey-medium); margin-top: 0;">*Bạn có thể thay đổi ngay cả khi đang live.</p>
            
            <div class="control-group">
                <label>Độ Nét (Resolution):</label>
                <select id="resSelect">
                    <option value="480">480p - Thấp</option>
                    <option value="720">720p - HD</option>
                    <option value="1080" selected>1080p - Full HD</option>
                </select>
            </div>
            <div class="flex-row control-group">
                <div>
                    <label>FPS:</label>
                    <select id="fpsSelect">
                        <option value="30">30</option>
                        <option value="60" selected>60</option>
                    </select>
                </div>
                <div>
                    <label>Bitrate:</label>
                    <select id="bitrateSelect">
                        <option value="5000000">5 Mbps</option>
                        <option value="8000000">8 Mbps</option>
                        <option value="15000000" selected>15 Mbps</option>
                    </select>
                </div>
            </div>

            <button class="btn-gold" id="btnStartStream" style="margin-top: 15px;">🔴 Bắt Đầu Phát Live</button>
            <button class="btn-maroon" id="btnStopStream" style="display:none; margin-top: 15px;">⬛ Dừng Phát Live</button>
        </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Chào mừng bạn đã vào phòng!</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn...">
                    <button class="btn-gold" id="btnSendChat" style="width: 80px;">Gửi</button>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--luxury-grey-medium);">
                <p>Thành viên trong phòng: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong></p>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let myUsername = "";
        let isHost = false;
        let currentRoomName = "";
        
        let myStream = null;
        let connectedPeers = new Set();  
        let peerUsernames = {};          
        let dataConnections = {};        
        let mediaCalls = {};             

        const peerConfig = {
            config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] }
        };

        const modalStatus = document.getElementById('modalStatus');
        const videoGrid = document.getElementById('videoGrid');
        const memberCount = document.getElementById('memberCount');
        const roomInfoBadge = document.getElementById('roomInfoBadge');

        // ==========================================
        // UI & POPUP FLOW
        // ==========================================
        function goToStep2() {
            const input = document.getElementById('welcomeNameInput').value.trim();
            if (!input) return alert("Bạn chưa nhập tên!");
            myUsername = input;
            
            document.getElementById('step1-Name').style.display = 'none';
            document.getElementById('step2-Room').style.display = 'block';
            document.getElementById('previewName').innerText = myUsername;
        }

        function handleCreateRoom() {
            const rName = document.getElementById('createRoomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng muốn tạo!");
            currentRoomName = rName;
            initPeer('room-' + rName, true);
        }

        function handleJoinRoom() {
            const rName = document.getElementById('joinRoomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập ID phòng muốn vào!");
            currentRoomName = rName;
            initPeer(null, false, rName);
        }

        function enterMainRoom() {
            // Hiệu ứng mờ dần popup và hiện giao diện chính
            document.getElementById('overlayModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlayModal').style.display = 'none';
                document.getElementById('mainLayout').style.display = 'grid';
            }, 500);

            // Cập nhật thông tin thẻ Badge
            const role = isHost ? "Chủ Phòng (Host ♛)" : "Khách";
            roomInfoBadge.innerHTML = `Biệt danh: <strong>${myUsername}</strong><br>Phòng: <strong>${currentRoomName}</strong><br>Vai trò: <strong>${role}</strong>`;
        }

        // ==========================================
        // CHỨC NĂNG CẬP NHẬT CHẤT LƯỢNG KHI ĐANG LIVE
        // ==========================================
        async function updateLiveQuality() {
            if (!myStream) return; // Nếu chưa live thì không làm gì cả

            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            const bitVal = parseInt(document.getElementById('bitrateSelect').value);

            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }
            if(resVal === 480) { w = 854; h = 480; }

            // 1. Cập nhật độ phân giải / FPS vào luồng video gốc của trình duyệt
            try {
                const videoTrack = myStream.getVideoTracks()[0];
                if (videoTrack) {
                    await videoTrack.applyConstraints({
                        width: { ideal: w, max: w },
                        height: { ideal: h, max: h },
                        frameRate: { ideal: fpsVal, max: fpsVal }
                    });
                }
            } catch (e) {
                console.warn("Trình duyệt không hỗ trợ đổi Res/FPS trực tiếp:", e);
            }

            // 2. Cập nhật "nóng" Bitrate cho TẤT CẢ khán giả đang xem mà không làm đứt kết nối
            for (let id in mediaCalls) {
                const call = mediaCalls[id];
                if (!call.peerConnection) continue;
                try {
                    const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        const params = sender.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        
                        params.encodings[0].maxBitrate = bitVal; 
                        params.degradationPreference = 'maintain-resolution'; // Chống vỡ nét
                        
                        await sender.setParameters(params);
                    }
                } catch (e) { console.error("Lỗi cập nhật bitrate:", e); }
            }
            
            sysLog(`⚙️ Đã áp dụng cấu hình: ${resVal}p | ${fpsVal}FPS | ${bitVal/1000000}Mbps`);
        }

        // Gắn sự kiện: Bất cứ khi nào đổi tùy chọn ở 3 menu thả xuống -> Chạy hàm update
        document.getElementById('resSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('fpsSelect').addEventListener('change', updateLiveQuality);
        document.getElementById('bitrateSelect').addEventListener('change', updateLiveQuality);

        // ==========================================
        // KHỞI TẠO PEER VÀ KẾT NỐI MẠNG LƯỚI
        // ==========================================
        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy();
            
            modalStatus.innerText = "Đang kết nối server...";
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id;
                isHost = hostMode;
                if(isHost && !myUsername.includes("Host")) myUsername += " ♛";
                peerUsernames[myId] = myUsername; 
                
                // Vào phòng thành công -> Ẩn Modal -> Mở UI chính
                enterMainRoom();

                if (!isHost) {
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
                
                updateMemberCount();
            });

            peer.on('connection', (conn) => { setupDataConnection(conn); });

            peer.on('call', (call) => {
                call.answer(myStream); 
                updateLiveQuality(); // Ép cấu hình cho người mới gọi tới
                
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream);
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    modalStatus.innerText = "❌ Tên phòng này đã có người tạo. Vui lòng bấm 'Tham Gia' hoặc chọn tên khác.";
                } else if (err.type === 'peer-unavailable') {
                    modalStatus.innerText = "❌ Không tìm thấy phòng! Hãy chắc chắn Host đã tạo phòng.";
                } else {
                    console.error(err);
                }
            });
        }

        // --- ĐỒNG BỘ DATA ---
        function setupDataConnection(conn) {
            conn.on('open', () => {
                connectedPeers.add(conn.peer);
                dataConnections[conn.peer] = conn;

                conn.send({ type: 'HANDSHAKE', username: myUsername });
                
                setTimeout(() => {
                    if(conn.open) conn.send({ type: 'REQUEST_STREAM' });
                }, 1000);

                if (isHost) {
                    const peersData = Array.from(connectedPeers)
                        .filter(id => id !== conn.peer)
                        .map(id => ({ id: id, username: peerUsernames[id] || "Khách" }));

                    conn.send({ type: 'PEER_LIST', peers: peersData });

                    peersData.forEach(p => {
                        if(dataConnections[p.id]) {
                            dataConnections[p.id].send({ 
                                type: 'NEW_PEER', peer: conn.peer, username: peerUsernames[conn.peer] || "Khách" 
                            });
                        }
                    });
                }
                updateMemberCount();
            });

            conn.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    peerUsernames[conn.peer] = data.username;
                    sysLog(`<strong>${data.username}</strong> đã tham gia phòng.`);
                    updateVideoLabel(conn.peer);
                }
                else if (data.type === 'REQUEST_STREAM') {
                    if (myStream) {
                        const call = peer.call(conn.peer, myStream);
                        mediaCalls[conn.peer] = call;
                        updateLiveQuality(); // Gửi cấu hình chuẩn
                    }
                }
                else if (data.type === 'PEER_LIST' || data.type === 'NEW_PEER') {
                    const processPeer = (pId, pName) => {
                        peerUsernames[pId] = pName;
                        if (pId !== myId && !dataConnections[pId]) {
                            setupDataConnection(peer.connect(pId));
                        }
                    };
                    if (data.type === 'PEER_LIST') data.peers.forEach(p => processPeer(p.id, p.username));
                    else processPeer(data.peer, data.username);
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
            });

            conn.on('close', () => {
                const isDisconnectedHost = conn.peer.startsWith('room-');
                const name = peerUsernames[conn.peer] || "Một người";
                
                if (isDisconnectedHost) sysWarn(`⚠️ CẢNH BÁO: Chủ phòng (${name}) đã thoát!`);
                else sysLog(`<strong>${name}</strong> đã rời khỏi phòng.`);
                
                connectedPeers.delete(conn.peer);
                delete dataConnections[conn.peer];
                delete peerUsernames[conn.peer];
                delete mediaCalls[conn.peer]; // Xóa lịch sử call
                
                removeVideoStream(conn.peer);
                updateMemberCount();
            });
        }

        // ==========================================
        // PHÁT LIVE
        // ==========================================
        document.getElementById('btnStartStream').addEventListener('click', async () => {
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }
            if(resVal === 480) { w = 854; h = 480; }

            try {
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fpsVal, max: fpsVal } },
                    audio: true
                });
                
                if (myStream.getVideoTracks()[0]) myStream.getVideoTracks()[0].contentHint = 'detail';

                addVideoStream('me', myStream, true);

                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';

                myStream.getVideoTracks()[0].onended = stopStream;

                connectedPeers.forEach(id => {
                    const call = peer.call(id, myStream);
                    mediaCalls[id] = call;
                });
                
                // Ép cấu hình bitrate ngay sau khi gọi
                setTimeout(updateLiveQuality, 500);

            } catch (err) { console.error("Lỗi chia sẻ màn hình:", err); }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            removeVideoStream('me');
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            mediaCalls = {};
        }

        // --- VIDEO UI & CHAT SYSTEM ---
        function addVideoStream(id, stream, isMe = false) {
            if (document.getElementById('video-wrap-' + id)) {
                document.getElementById('video-' + id).srcObject = stream;
                return;
            }

            const wrap = document.createElement('div');
            wrap.className = 'video-wrapper';
            wrap.id = 'video-wrap-' + id;

            const vid = document.createElement('video');
            vid.id = 'video-' + id;
            vid.srcObject = stream;
            vid.autoplay = true; vid.playsInline = true; vid.controls = !isMe;
            if (isMe) vid.muted = true;

            const label = document.createElement('div');
            label.className = 'video-label';
            label.id = 'video-label-' + id;
            const displayName = isMe ? `${myUsername} (Bạn)` : (peerUsernames[id] || `Thành viên`);
            label.innerText = `🔴 ${displayName}`;

            wrap.appendChild(vid); wrap.appendChild(label);
            videoGrid.appendChild(wrap);
        }

        function updateVideoLabel(id) {
            const label = document.getElementById('video-label-' + id);
            if (label && peerUsernames[id]) label.innerText = `🔴 ${peerUsernames[id]}`;
        }
        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) el.remove();
        }
        function updateMemberCount() { memberCount.innerText = connectedPeers.size + 1; }

        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const dataPacket = { type: 'CHAT', sender: myUsername, msg: msg };
            appendChat("Bạn", msg); input.value = '';

            connectedPeers.forEach(id => {
                if (dataConnections[id] && dataConnections[id].open) dataConnections[id].send(dataPacket);
            });
        }

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages');
            const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            box.innerHTML += `<p><span class="sender" style="color:${color}">${sender}:</span> ${msg}</p>`;
            box.scrollTop = box.scrollHeight;
        }
        function sysLog(msg) { document.getElementById('chatMessages').innerHTML += `<p><span class="sys-msg">Hệ Thống:</span> ${msg}</p>`; document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight; }
        function sysWarn(msg) { document.getElementById('chatMessages').innerHTML += `<p><span class="sys-warn">${msg}</span></p>`; document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight; }
    </script>
</body>
</html>
