<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Live Room - Pro Stream Max Quality</title>
    <style>
        /* BẢNG MÀU LUXURY & CSS CƠ BẢN */
        :root {
            --luxury-gold: #c69c6d;
            --luxury-maroon: #8d1c1c;
            --luxury-grey-light: #e5e5e5;
            --luxury-grey-medium: #888888;
            --luxury-black: #000000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --gold-gradient: linear-gradient(45deg, #c69c6d, #d9b88f, #f2d7b1, #d9b88f, #c69c6d);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: var(--luxury-grey-light);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            letter-spacing: 2px;
        }

        /* BỐ CỤC CHÍNH */
        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr 320px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            height: 85vh;
        }

        /* PANEL CÔNG CỤ */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(198, 156, 109, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .panel h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 5px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3em;
            border-bottom: 1px solid var(--luxury-maroon);
            padding-bottom: 8px;
            text-align: center;
        }

        /* KHU VỰC ĐIỀU KHIỂN & INPUT */
        .control-group { margin-bottom: 5px; }
        .control-group label { font-size: 13px; color: var(--luxury-gold); margin-bottom: 5px; display: block;}
        
        select, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--luxury-grey-medium);
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            background: #0a0a0a;
            color: var(--luxury-gold);
        }
        
        select:focus, input:focus { outline: none; border-color: var(--luxury-gold); }

        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        /* KHU VỰC CHỜ (Làm mờ khi chưa vào phòng) */
        .disabled-area {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* BUTTONS */
        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-gold { background: var(--gold-gradient); color: var(--luxury-black); }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(198, 156, 109, 0.5); }
        .btn-maroon { background: var(--luxury-maroon); color: white; }
        .btn-maroon:hover { background: #6b1414; }
        .btn-dark { background: var(--luxury-black); color: var(--luxury-gold); border: 1px solid var(--luxury-gold); }
        .btn-dark:hover { background: var(--gold-gradient); color: var(--luxury-black); }

        /* KHU VỰC VIDEO GRID (MÀN HÌNH CHÍNH) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            align-content: start;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(198, 156, 109, 0.3);
            overflow-y: auto;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            border: 2px solid var(--luxury-gold);
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: var(--luxury-gold);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(198, 156, 109, 0.5);
        }

        /* KHU VỰC CHAT */
        .chat-box { flex: 1; display: flex; flex-direction: column; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid rgba(198, 156, 109, 0.2);
            min-height: 200px;
        }
        .chat-messages p { margin: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .sender { color: var(--luxury-gold); font-weight: bold; }
        .sys-msg { color: var(--luxury-maroon); font-style: italic; font-weight: bold; }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>♛ Phòng Live Đa Kết Nối ♛</h1>
    
    <div class="main-layout">
        
        <div class="panel">
            <h3>ĐĂNG KÝ THÔNG TIN</h3>
            
            <div class="control-group">
                <label>Biệt danh:</label>
                <input type="text" id="usernameInput" placeholder="VD: GamerPro99">
            </div>

            <div class="control-group">
                <label>Tên Phòng:</label>
                <input type="text" id="roomInput" placeholder="VD: phong-cua-boss">
            </div>
            
            <div class="flex-row">
                <button class="btn-gold" id="btnCreateRoom">Tạo Phòng (Host)</button>
                <button class="btn-dark" id="btnJoinRoom">Vào Phòng</button>
            </div>
            
            <p id="roomStatus" style="font-size: 12px; color: var(--luxury-maroon); text-align: center; margin: 0;"></p>

            <div id="liveConfigArea" class="disabled-area">
                <hr style="border-color: rgba(198, 156, 109, 0.2); width: 100%; margin: 15px 0;">
                
                <h3>CẤU HÌNH LIVE</h3>
                <div class="flex-row control-group">
                    <div>
                        <label>Phân Giải:</label>
                        <select id="resSelect">
                            <option value="480">480p</option>
                            <option value="720">720p</option>
                            <option value="1080" selected>1080p</option>
                        </select>
                    </div>
                    <div>
                        <label>FPS:</label>
                        <select id="fpsSelect">
                            <option value="30">30</option>
                            <option value="60" selected>60</option>
                        </select>
                    </div>
                    <div>
                        <label>Bitrate:</label>
                        <select id="bitrateSelect">
                            <option value="2500000">2.5 Mbps</option>
                            <option value="5000000">5 Mbps</option>
                            <option value="8000000" selected>8 Mbps</option>
                            <option value="15000000">15 Mbps (Max)</option>
                        </select>
                    </div>
                </div>

                <button class="btn-gold" id="btnStartStream" style="margin-top: 10px;">Bắt Đầu Phát Live</button>
                <button class="btn-maroon" id="btnStopStream" style="display:none; margin-top: 10px;">Dừng Phát Live</button>
            </div>
        </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="panel">
            <h3>KÊNH TƯƠNG TÁC</h3>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <p><span class="sys-msg">Hệ Thống:</span> Hãy tạo hoặc vào phòng để bắt đầu.</p>
                </div>
                <div class="flex-row" style="gap:5px;">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." disabled>
                    <button class="btn-gold" id="btnSendChat" style="width: 80px;" disabled>Gửi</button>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--luxury-grey-medium);">
                <p>Thành viên trong phòng: <strong id="memberCount" style="color:var(--luxury-gold)">0</strong></p>
            </div>
        </div>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let peer = null;
        let myId = "";
        let myUsername = "Khách";
        let isHost = false;
        let myStream = null;
        
        let connectedPeers = new Set();  
        let peerUsernames = {};          
        let dataConnections = {};        
        let mediaCalls = {};             

        const peerConfig = {
            config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] }
        };

        const roomStatus = document.getElementById('roomStatus');
        const videoGrid = document.getElementById('videoGrid');
        const memberCount = document.getElementById('memberCount');
        const liveConfigArea = document.getElementById('liveConfigArea');

        function getEnteredUsername() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val) return val;
            return "Khách_" + Math.floor(1000 + Math.random() * 9000);
        }

        // HÀM ÉP BITRATE VÀ ĐỘ NÉT
        async function forceHighBitrate(call) {
            try {
                if (!call.peerConnection) return;
                const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    const params = sender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    
                    const selectedBitrate = parseInt(document.getElementById('bitrateSelect').value);
                    params.encodings[0].maxBitrate = selectedBitrate; 
                    
                    // LỆNH QUAN TRỌNG: Ép trình duyệt giữ nguyên độ phân giải (1080p),
                    // chấp nhận rớt chút FPS thay vì làm mờ hình ảnh.
                    params.degradationPreference = 'maintain-resolution';
                    
                    await sender.setParameters(params);
                }
            } catch (e) {
                console.error("Lỗi ép thông số:", e);
            }
        }

        // --- 1. XỬ LÝ VÀO / TẠO PHÒNG ---
        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng!");
            
            myUsername = getEnteredUsername();
            if(isHost) myUsername += " (Host♛)";
            
            initPeer('room-' + rName, true);
        });

        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            const rName = document.getElementById('roomInput').value.trim();
            if(!rName) return alert("Vui lòng nhập tên phòng muốn vào!");
            
            myUsername = getEnteredUsername();
            initPeer(null, false, rName);
        });

        function initPeer(customId, hostMode, targetRoomName = "") {
            if (peer) peer.destroy();
            
            roomStatus.innerText = "Đang khởi tạo...";
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                myId = id;
                isHost = hostMode;
                if(isHost && !myUsername.includes("Host")) myUsername += "♛";
                
                peerUsernames[myId] = myUsername; 
                
                roomStatus.innerText = isHost ? "Đã tạo phòng thành công!" : "Đã tham gia phòng!";
                roomStatus.style.color = "var(--luxury-gold)";
                
                // MỞ KHÓA KHU VỰC CẤU HÌNH LIVE VÀ CHAT
                liveConfigArea.classList.remove('disabled-area');
                document.getElementById('chatInput').disabled = false;
                document.getElementById('btnSendChat').disabled = false;
                document.getElementById('usernameInput').disabled = true;

                if (!isHost) {
                    const hostConn = peer.connect('room-' + targetRoomName);
                    setupDataConnection(hostConn);
                }
                
                updateMemberCount();
            });

            peer.on('connection', (conn) => { setupDataConnection(conn); });

            peer.on('call', (call) => {
                call.answer(myStream);
                
                forceHighBitrate(call); 
                
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream);
                });
                
                call.on('close', () => {
                    removeVideoStream(call.peer);
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("Tên phòng này đã có người tạo. Vui lòng nhấn 'VÀO PHÒNG' hoặc chọn tên phòng khác.");
                    roomStatus.innerText = "Lỗi trùng tên phòng.";
                } else {
                    console.error(err);
                }
            });
        }

        // --- 2. XỬ LÝ ĐỒNG BỘ P2P ---
        function setupDataConnection(conn) {
            conn.on('open', () => {
                connectedPeers.add(conn.peer);
                dataConnections[conn.peer] = conn;

                conn.send({ type: 'HANDSHAKE', username: myUsername });

                if (isHost) {
                    const peersData = Array.from(connectedPeers)
                        .filter(id => id !== conn.peer)
                        .map(id => ({ id: id, username: peerUsernames[id] || "Khách" }));

                    conn.send({ type: 'PEER_LIST', peers: peersData });

                    peersData.forEach(p => {
                        if(dataConnections[p.id]) {
                            dataConnections[p.id].send({ 
                                type: 'NEW_PEER', 
                                peer: conn.peer, 
                                username: peerUsernames[conn.peer] || "Khách" 
                            });
                        }
                    });
                }
                
                updateMemberCount();

                if (myStream) {
                    const call = peer.call(conn.peer, myStream);
                    forceHighBitrate(call); 
                    call.on('stream', (remoteStream) => addVideoStream(conn.peer, remoteStream));
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    peerUsernames[conn.peer] = data.username;
                    sysLog(`<strong>${data.username}</strong> đã tham gia phòng.`);
                    updateVideoLabel(conn.peer);
                }
                else if (data.type === 'PEER_LIST') {
                    data.peers.forEach(p => {
                        peerUsernames[p.id] = p.username;
                        if (p.id !== myId && !dataConnections[p.id]) {
                            const newConn = peer.connect(p.id);
                            setupDataConnection(newConn);
                        }
                    });
                } 
                else if (data.type === 'NEW_PEER') {
                    peerUsernames[data.peer] = data.username;
                    if (data.peer !== myId && !dataConnections[data.peer]) {
                        const newConn = peer.connect(data.peer);
                        setupDataConnection(newConn);
                    }
                } 
                else if (data.type === 'CHAT') {
                    appendChat(data.sender, data.msg);
                }
            });

            conn.on('close', () => {
                const name = peerUsernames[conn.peer] || conn.peer.substring(0,5);
                sysLog(`<strong>${name}</strong> đã rời khỏi phòng.`);
                
                connectedPeers.delete(conn.peer);
                delete dataConnections[conn.peer];
                delete peerUsernames[conn.peer];
                
                removeVideoStream(conn.peer);
                updateMemberCount();
            });
        }

        // --- 3. PHÁT LIVE MÀN HÌNH (TỐI ƯU CỨNG ĐỘ PHÂN GIẢI) ---
        document.getElementById('btnStartStream').addEventListener('click', async () => {
            const resVal = parseInt(document.getElementById('resSelect').value);
            const fpsVal = parseInt(document.getElementById('fpsSelect').value);
            
            let w = 1280, h = 720;
            if(resVal === 1080) { w = 1920; h = 1080; }
            if(resVal === 480) { w = 854; h = 480; }

            try {
                // Khai báo strict (ideal và max) để ép trình duyệt tuân thủ tuyệt đối cấu hình
                myStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        width: { ideal: w, max: w }, 
                        height: { ideal: h, max: h }, 
                        frameRate: { ideal: fpsVal, max: fpsVal } 
                    },
                    audio: true
                });

                // Chuyển contentHint sang 'detail' để ưu tiên giữ độ sắc nét của hình ảnh chi tiết
                const videoTrack = myStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.contentHint = 'detail';
                }

                addVideoStream('me', myStream, true);

                document.getElementById('btnStartStream').style.display = 'none';
                document.getElementById('btnStopStream').style.display = 'block';
                
                // Vô hiệu hóa cấu hình khi đang live để tránh lỗi
                document.getElementById('resSelect').disabled = true;
                document.getElementById('fpsSelect').disabled = true;
                document.getElementById('bitrateSelect').disabled = true;

                myStream.getVideoTracks()[0].onended = stopStream;

                connectedPeers.forEach(id => {
                    const call = peer.call(id, myStream);
                    mediaCalls[id] = call;
                    forceHighBitrate(call); 
                    call.on('stream', (remoteStream) => addVideoStream(id, remoteStream));
                });

            } catch (err) {
                console.error("Lỗi chia sẻ màn hình:", err);
            }
        });

        document.getElementById('btnStopStream').addEventListener('click', stopStream);

        function stopStream() {
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            removeVideoStream('me');
            
            document.getElementById('btnStartStream').style.display = 'block';
            document.getElementById('btnStopStream').style.display = 'none';
            
            // Mở khóa lại cấu hình
            document.getElementById('resSelect').disabled = false;
            document.getElementById('fpsSelect').disabled = false;
            document.getElementById('bitrateSelect').disabled = false;

            mediaCalls = {};
        }

        // --- 4. HIỂN THỊ VIDEO ---
        function addVideoStream(id, stream, isMe = false) {
            if (document.getElementById('video-wrap-' + id)) return;

            const wrap = document.createElement('div');
            wrap.className = 'video-wrapper';
            wrap.id = 'video-wrap-' + id;

            const vid = document.createElement('video');
            vid.srcObject = stream;
            vid.autoplay = true;
            vid.playsInline = true;
            vid.controls = !isMe;
            if (isMe) vid.muted = true;

            const label = document.createElement('div');
            label.className = 'video-label';
            label.id = 'video-label-' + id;
            
            const displayName = isMe ? `${myUsername} (Bạn)` : (peerUsernames[id] || `Thành viên`);
            label.innerText = `🔴 ${displayName}`;

            wrap.appendChild(vid);
            wrap.appendChild(label);
            videoGrid.appendChild(wrap);
        }

        function updateVideoLabel(id) {
            const label = document.getElementById('video-label-' + id);
            if (label && peerUsernames[id]) {
                label.innerText = `🔴 ${peerUsernames[id]}`;
            }
        }

        function removeVideoStream(id) {
            const el = document.getElementById('video-wrap-' + id);
            if (el) el.remove();
        }

        function updateMemberCount() {
            memberCount.innerText = connectedPeers.size + 1;
        }

        // --- 5. HỆ THỐNG CHAT ---
        document.getElementById('btnSendChat').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const dataPacket = { type: 'CHAT', sender: myUsername, msg: msg };
            
            appendChat("Bạn", msg);
            input.value = '';

            connectedPeers.forEach(id => {
                if (dataConnections[id] && dataConnections[id].open) {
                    dataConnections[id].send(dataPacket);
                }
            });
        }

        function appendChat(sender, msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            const color = sender === "Bạn" ? "var(--luxury-gold)" : "#fff";
            p.innerHTML = `<span class="sender" style="color:${color}">${sender}:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }

        function sysLog(msg) {
            const box = document.getElementById('chatMessages');
            const p = document.createElement('p');
            p.innerHTML = `<span class="sys-msg">Hệ Thống:</span> ${msg}`;
            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
